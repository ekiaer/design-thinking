<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ENDURE · Venture Assessment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0D1117;
      color: #E8E3D8;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── HEADER ── */
    .header {
      border-bottom: 1px solid rgba(212,168,83,0.18);
      padding: 18px 40px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-mark {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 20px;
      font-weight: 600;
      color: #D4A853;
      letter-spacing: -1px;
    }
    .header-sub {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 300;
      color: rgba(232,227,216,0.4);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .main {
      max-width: 740px;
      margin: 0 auto;
      padding: 32px 40px 80px;
    }

    /* ── STEP INDICATOR ── */
    .step-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    .step-pill {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(232,227,216,0.08);
      color: rgba(232,227,216,0.25);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .step-pill.active {
      border-color: rgba(212,168,83,0.5);
      color: #D4A853;
      background: rgba(212,168,83,0.08);
    }
    .step-pill.done {
      border-color: rgba(92,184,138,0.3);
      color: rgba(92,184,138,0.6);
    }
    .step-connector {
      align-self: center;
      color: rgba(232,227,216,0.12);
      font-size: 10px;
    }

    /* ── TYPOGRAPHY ── */
    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #D4A853;
      margin-bottom: 18px;
    }
    .intro-heading {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      line-height: 1.1;
      font-weight: 400;
      color: #E8E3D8;
      margin-bottom: 22px;
    }
    .intro-body {
      font-size: 15px;
      color: rgba(232,227,216,0.55);
      max-width: 560px;
      line-height: 1.75;
      margin-bottom: 40px;
    }
    .section-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(212,168,83,0.6);
      margin-bottom: 16px;
    }
    .dim-heading {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 400;
      color: #E8E3D8;
      margin-bottom: 10px;
    }
    .dim-body {
      font-size: 14px;
      color: rgba(232,227,216,0.45);
      line-height: 1.7;
      margin-bottom: 32px;
      max-width: 560px;
    }

    /* ── CARDS & FORMS ── */
    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(232,227,216,0.08);
      border-radius: 8px;
      padding: 32px;
      margin-bottom: 32px;
    }
    .form-group { margin-bottom: 24px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(212,168,83,0.75);
      margin-bottom: 8px;
    }
    .form-hint {
      font-size: 12px;
      color: rgba(232,227,216,0.35);
      margin-bottom: 8px;
      font-style: italic;
    }
    .form-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(232,227,216,0.1);
      border-radius: 4px;
      color: #E8E3D8;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
    }
    .form-input:focus { border-color: rgba(212,168,83,0.45); }
    .form-input::placeholder { color: rgba(232,227,216,0.2); }

    /* ── BUTTONS ── */
    .btn {
      background: #D4A853;
      color: #0D1117;
      border: none;
      border-radius: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      padding: 13px 28px;
      cursor: pointer;
      text-transform: uppercase;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .btn-ghost {
      background: transparent;
      color: rgba(232,227,216,0.5);
      border: 1px solid rgba(232,227,216,0.12);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.04); opacity: 1; color: #E8E3D8; }
    .btn-back {
      background: transparent;
      color: rgba(232,227,216,0.35);
      border: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.05em;
      cursor: pointer;
      padding: 8px 0;
      margin-bottom: 20px;
      transition: color 0.15s;
    }
    .btn-back:hover { color: rgba(232,227,216,0.6); }
    .btn-copy {
      background: transparent;
      color: rgba(232,227,216,0.5);
      border: 1px solid rgba(232,227,216,0.12);
    }
    .btn-copy:hover { background: rgba(255,255,255,0.04); opacity: 1; color: #E8E3D8; }
    .btn-copy.copied { color: #5CB88A; border-color: rgba(92,184,138,0.3); }
    .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    /* ── PROGRESS BAR (questions) ── */
    .progress-track {
      display: flex;
      gap: 5px;
      margin-bottom: 40px;
    }
    .progress-seg {
      height: 3px;
      flex: 1;
      border-radius: 2px;
      background: rgba(232,227,216,0.08);
      transition: background 0.3s;
    }
    .progress-seg.active { background: #D4A853; }
    .progress-seg.done { background: rgba(212,168,83,0.35); }

    /* ── INTERVIEW QUESTIONS ── */
    .q-text {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      line-height: 1.35;
      font-weight: 400;
      color: #E8E3D8;
      margin-bottom: 10px;
    }
    .q-hint {
      font-size: 13px;
      color: rgba(232,227,216,0.38);
      font-style: italic;
      margin-bottom: 28px;
    }
    .q-counter {
      font-size: 12px;
      color: rgba(232,227,216,0.28);
      align-self: center;
    }

    /* ── SYNTHESIS DISPLAY ── */
    .synthesis-card {
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(232,227,216,0.07);
      border-left: 3px solid rgba(212,168,83,0.4);
      border-radius: 0 8px 8px 0;
      padding: 28px;
      margin-bottom: 24px;
    }
    .synthesis-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(212,168,83,0.55);
      margin-bottom: 10px;
    }
    .synthesis-text {
      font-size: 14px;
      color: rgba(232,227,216,0.65);
      line-height: 1.8;
      white-space: pre-wrap;
    }
    .unmet-need {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-style: italic;
      color: rgba(212,168,83,0.7);
      line-height: 1.5;
      padding: 18px 0;
      border-top: 1px solid rgba(232,227,216,0.06);
      border-bottom: 1px solid rgba(232,227,216,0.06);
      margin: 16px 0;
    }
    .gaps-text {
      font-size: 13px;
      color: rgba(232,227,216,0.38);
      font-style: italic;
      line-height: 1.7;
      margin-top: 14px;
    }
    .reading-connection {
      background: rgba(126,184,218,0.04);
      border-left: 2px solid rgba(126,184,218,0.25);
      border-radius: 0 8px 8px 0;
      padding: 18px 20px;
      margin-top: 20px;
    }
    .reading-connection-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(126,184,218,0.6);
      margin-bottom: 8px;
    }
    .reading-connection-text {
      font-size: 13px;
      color: rgba(232,227,216,0.55);
      line-height: 1.7;
      font-style: italic;
    }
    .reading-connection-sources {
      font-size: 11px;
      color: rgba(232,227,216,0.3);
      margin-top: 10px;
    }
    .maturity-badge {
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 12px;
    }
    .maturity-concept { border: 1px solid rgba(224,117,88,0.35); color: #E07558; }
    .maturity-early { border: 1px solid rgba(212,168,83,0.35); color: #D4A853; }
    .maturity-validated { border: 1px solid rgba(92,184,138,0.35); color: #5CB88A; }

    /* ── ASSUMPTION CERTAINTY ── */
    .assumption-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }
    .assumption-card {
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(232,227,216,0.07);
      border-radius: 8px;
      padding: 20px 24px;
    }
    .assumption-text {
      font-size: 14px;
      color: rgba(232,227,216,0.6);
      line-height: 1.6;
      margin-bottom: 14px;
    }
    .certainty-pills {
      display: flex;
      gap: 8px;
    }
    .certainty-pill {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 4px;
      border: 1px solid rgba(232,227,216,0.1);
      background: transparent;
      color: rgba(232,227,216,0.35);
      cursor: pointer;
      transition: all 0.15s;
    }
    .certainty-pill:hover {
      border-color: rgba(212,168,83,0.3);
      color: rgba(232,227,216,0.6);
    }
    .certainty-pill.selected {
      background: #D4A853;
      border-color: #D4A853;
      color: #0D1117;
    }

    /* ── RATING CARDS ── */
    .rating-cards {
      display: flex;
      gap: 14px;
      margin-bottom: 32px;
    }
    .rating-card {
      flex: 1;
      cursor: pointer;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(232,227,216,0.08);
      border-radius: 8px;
      padding: 24px 20px;
      transition: border-color 0.2s, background 0.2s;
      text-align: center;
    }
    .rating-card:hover { border-color: rgba(212,168,83,0.3); }
    .rating-card.selected {
      border-color: rgba(212,168,83,0.6);
      background: rgba(212,168,83,0.06);
    }
    .rating-number {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 700;
      color: rgba(232,227,216,0.2);
      margin-bottom: 8px;
      transition: color 0.2s;
    }
    .rating-card.selected .rating-number { color: #D4A853; }
    .rating-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(212,168,83,0.5);
      margin-bottom: 8px;
    }
    .rating-desc {
      font-size: 12px;
      color: rgba(232,227,216,0.35);
      line-height: 1.5;
    }

    /* ── LOADING ── */
    .loading-wrap {
      padding: 100px 0;
      text-align: center;
    }
    .spinner {
      width: 38px; height: 38px;
      border: 2px solid rgba(212,168,83,0.12);
      border-top-color: #D4A853;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(212,168,83,0.55);
    }

    /* ── BRIEF OUTPUT ── */
    .brief-header {
      margin-bottom: 40px;
    }
    .brief-title {
      font-family: 'Playfair Display', serif;
      font-size: 34px;
      font-weight: 400;
      color: #E8E3D8;
      margin-bottom: 4px;
    }
    .brief-meta {
      font-size: 13px;
      color: rgba(232,227,216,0.35);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.05em;
    }
    .brief-section {
      margin-bottom: 40px;
    }
    .brief-section-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(212,168,83,0.6);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(232,227,216,0.06);
    }
    .brief-card {
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(232,227,216,0.07);
      border-radius: 8px;
      padding: 28px;
      margin-bottom: 16px;
    }
    .brief-text {
      font-size: 14px;
      color: rgba(232,227,216,0.62);
      line-height: 1.85;
      white-space: pre-wrap;
    }
    .rating-badge {
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: 4px;
      margin-bottom: 14px;
    }
    .rating-badge-1 { background: rgba(224,117,88,0.12); color: #E07558; }
    .rating-badge-2 { background: rgba(212,168,83,0.12); color: #D4A853; }
    .rating-badge-3 { background: rgba(92,184,138,0.12); color: #5CB88A; }

    /* Uncertainty map */
    .uncertainty-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 10px 0;
      border-bottom: 1px solid rgba(232,227,216,0.04);
      gap: 16px;
    }
    .uncertainty-item:last-child { border-bottom: none; }
    .uncertainty-text {
      font-size: 13px;
      color: rgba(232,227,216,0.55);
      flex: 1;
    }
    .uncertainty-dim {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(232,227,216,0.25);
      white-space: nowrap;
    }
    .uncertainty-cert {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .cert-low { color: #E07558; }
    .cert-mid { color: #D4A853; }
    .cert-high { color: #5CB88A; }
    .avg-confidence {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 28px;
      font-weight: 600;
      color: #D4A853;
      margin-bottom: 6px;
    }
    .avg-label {
      font-size: 12px;
      color: rgba(232,227,216,0.35);
      margin-bottom: 16px;
    }

    /* ── CONCEPT REFERENCE ── */
    .concept-ref {
      font-size: 13px;
      color: rgba(232,227,216,0.35);
      font-style: italic;
      line-height: 1.6;
      padding: 14px 18px;
      border-left: 2px solid rgba(212,168,83,0.2);
      margin-bottom: 28px;
    }
    .concept-ref-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(212,168,83,0.4);
      font-style: normal;
      margin-bottom: 4px;
    }

    /* ── ERROR ── */
    .error-msg {
      color: #E07558;
      font-size: 13px;
      margin-bottom: 16px;
    }

    /* ── RESUME BANNER ── */
    .resume-banner {
      background: rgba(212,168,83,0.06);
      border: 1px solid rgba(212,168,83,0.2);
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .resume-text {
      font-size: 14px;
      color: rgba(232,227,216,0.6);
    }
    .resume-actions { display: flex; gap: 10px; }

    /* ── PRINT ── */
    @media print {
      body { background: #fff; color: #111; }
      .header { border-color: #ddd; background: #fff; }
      .logo-mark { color: #222; }
      .no-print { display: none !important; }
      .step-bar { display: none !important; }
      .eyebrow, .section-label, .brief-section-title, .synthesis-label { color: #555; }
      .brief-card, .synthesis-card { background: #f8f6f0; border-color: #ddd; }
      .brief-text, .synthesis-text { color: #333; }
      .intro-heading, .brief-title, .dim-heading { color: #111; }
      .q-text { color: #111; }
      .rating-badge-1 { background: #fef0ec; color: #c0523a; }
      .rating-badge-2 { background: #fdf6e8; color: #9a7a2a; }
      .rating-badge-3 { background: #edf7f1; color: #3a8a5c; }
      .uncertainty-text { color: #333; }
      .uncertainty-cert { color: #111; }
      .cert-low { color: #c0523a; }
      .cert-mid { color: #9a7a2a; }
      .cert-high { color: #3a8a5c; }
      .unmet-need { color: #555; border-color: #ddd; }
      .synthesis-card { border-left-color: #999; }
      .reading-connection { background: #f4f8fb; border-left-color: #8ab4d0; }
      .reading-connection-label { color: #5a8ba8; }
      .reading-connection-text { color: #333; }
      .reading-connection-sources { color: #888; }
      .brief-section { page-break-inside: avoid; }
      .brief-section + .brief-section { page-break-before: auto; }
      .page-break { page-break-before: always; }
    }

    @media (max-width: 600px) {
      .main { padding: 24px 20px 60px; }
      .intro-heading { font-size: 30px; }
      .dim-heading { font-size: 24px; }
      .q-text { font-size: 20px; }
      .rating-cards { flex-direction: column; }
      .certainty-pills { flex-wrap: wrap; }
      .step-bar { gap: 4px; }
      .step-pill { font-size: 9px; padding: 4px 8px; }
      .step-connector { display: none; }
      .resume-banner { flex-direction: column; align-items: stretch; }
      .brief-title { font-size: 26px; }
      .avg-confidence { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>

  <script>
    // ═══════════════════════════════════════
    // CONFIG
    // ═══════════════════════════════════════
    var API_PROXY_URL = "https://endure-proxy.ekiaer.workers.dev";

    // Progress is kept in this browser so a student can stop and come back.
    // It is dropped after 14 days, and "Start Fresh" clears it at once.
    var VA_KEY = "va-state-fall2026";
    var VA_MAX_AGE_MS = 14 * 24 * 60 * 60 * 1000;
    function vaClear() { try { localStorage.removeItem(VA_KEY); localStorage.removeItem(VA_KEY + "-at"); } catch (err) { /* storage unavailable */ } }
    function vaSave(json) { try { localStorage.setItem(VA_KEY, json); localStorage.setItem(VA_KEY + "-at", String(Date.now())); } catch (err) { /* storage full or unavailable */ } }
    function vaLoad() {
      try {
        var at = Number(localStorage.getItem(VA_KEY + "-at") || 0);
        if (!at || Date.now() - at > VA_MAX_AGE_MS) { vaClear(); return null; }
        return localStorage.getItem(VA_KEY);
      } catch (err) { return null; }
    }

    // Tool output found in a journal or in pasted notes.
    // Keep one tool's text only: from its header to its closing rule. Every tool
    // (Unit Economics, Market Sizing, Financial Model) ends its text with a second
    // line of \u2550, so whatever the student wrote after it is left out. If the
    // closing rule is missing, stop at the next tool's header or the end of the text.
    var TOOL_HEADERS = ["ENDURE Unit Economics Analysis", "ENDURE Market Sizing Analysis", "ENDURE Financial Model"];
    function trimToolContent(content, startHeader) {
      if (!content) return null;
      var cutoff = content.length;
      TOOL_HEADERS.forEach(function(h) {

y out'. Do not use the terms CAC, LTV, COGS, TAM, SAM, gross margin or go-to-market. Call it a concept, not a venture or a startup.";

    // API HELPER
    // ═══════════════════════════════════════
    async function callClaude(userMsg, sys, maxTokens, useStream) {
      maxTokens = maxTokens || 4000;
      // Stream for large responses to avoid Cloudflare's 100s edge timeout
      if (useStream === undefined) useStream = maxTokens >= 6000;
      // userMsg can be a string or an array of content blocks (for multimodal)
      var content = typeof userMsg === "string" ? userMsg : userMsg;
      var payloadObj = {
        model: "claude-sonnet-4-6",
        max_tokens: maxTokens,
        system: sys + "\n\n" + COURSE_CONTEXT,
        messages: [{ role: "user", content: content }]
      };
      if (useStream) payloadObj.stream = true;
      var payload = JSON.stringify(payloadObj);

      var maxRetries = 3;
      var delay = 2000;
      for (var attempt = 0; attempt <= maxRetries; attempt++) {
        var res = await fetch(API_PROXY_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: payload
        });
        if ((res.status === 529 || res.status === 524 || res.status === 502 || res.status === 503 || res.status === 504) && attempt < maxRetries) {
          await new Promise(function(r) { setTimeout(r, delay); });
          delay *= 2;
          continue;
        }
        if (!res.ok) {
          var errBody = await res.text();
          throw new Error("API error: " + res.status + " " + errBody);
        }
        var text, stopReason;
        if (useStream) {
          // Read SSE stream and accumulate text deltas
          var reader = res.body.getReader();
          var decoder = new TextDecoder();
          var buffer = "";
          text = "";
          stopReason = null;
          while (true) {
            var readResult = await reader.read();
            if (readResult.done) break;
            buffer += decoder.decode(readResult.value, { stream: true });
            var lines = buffer.split("\n");
            buffer = lines.pop() || "";
            for (var li = 0; li < lines.length; li++) {
              var line = lines[li].trim();
              if (!line.startsWith("data:")) continue;
              var jsonStr = line.substring(5).trim();
              if (!jsonStr) continue;
              try {
                var evt = JSON.parse(jsonStr);
                if (evt.type === "content_block_delta" && evt.delta && evt.delta.text) {
                  text += evt.delta.text;
                } else if (evt.type === "message_delta" && evt.delta && evt.delta.stop_reason) {
                  stopReason = evt.delta.stop_reason;
                }
              } catch (e) { /* skip malformed chunks */ }
            }
          }
          if (stopReason === "max_tokens") {
            console.warn("[callClaude] Stream truncated (max_tokens). Length:", text.length);
          }
          console.log("[callClaude] stream stop_reason:", stopReason, "length:", text.length);
        } else {
          var data = await res.json();
          stopReason = data.stop_reason;
          if (stopReason === "max_tokens") {
            console.warn("[callClaude] Response truncated (max_tokens). Length:", data.content[0].text.length);
          }
          console.log("[callClaude] stop_reason:", stopReason, "length:", data.content[0].text.length);
          text = data.content[0].text;
        }
        text = text.replace(/^```(?:json)?\s*\n?/i, "").replace(/\n?```\s*$/i, "");
        // Extract JSON object/array if Claude added preamble or trailing text
        var jsonStart = text.indexOf("{");
        var jsonStartArr = text.indexOf("[");
        if (jsonStart === -1 || (jsonStartArr !== -1 && jsonStartArr < jsonStart)) jsonStart = jsonStartArr;
        if (jsonStart > 0) text = text.substring(jsonStart);
        var lastBrace = text.lastIndexOf("}");
        var lastBracket = text.lastIndexOf("]");
        var jsonEnd = Math.max(lastBrace, lastBracket);
        if (jsonEnd !== -1 && jsonEnd < text.length - 1) text = text.substring(0, jsonEnd + 1);
        // If truncated, attempt to repair the JSON by closing open structures
        if (stopReason === "max_tokens") {
          try { JSON.parse(text); } catch (e) {
            console.warn("[callClaude] Attempting JSON repair on truncated response");
            // Close any open string
            var qCount = (text.match(/(?:^|[^\\])"/g) || []).length;
            if (qCount % 2 !== 0) text += '"';
            // Close open braces/brackets
            var opens = 0, closes = 0, oB = 0, cB = 0;
            for (var ci = 0; ci < text.length; ci++) {
              if (text[ci] === "{") opens++;
              else if (text[ci] === "}") closes++;
              else if (text[ci] === "[") oB++;
              else if (text[ci] === "]") cB++;
            }
            for (var ri = 0; ri < oB - cB; ri++) text += "]";
            for (var ri2 = 0; ri2 < opens - closes; ri2++) text += "}";
          }
        }
        return text;
      }
    }

    function App() {
      var stateHook = useState(function() {
        var saved = vaLoad();

          try {
            var parsed = JSON.parse(saved);
            parsed.error = "";
            if (parsed.phase === "loading") {
              var savedHistory = (parsed.history || []).slice();
              var lastScreen = savedHistory.pop();
              if (lastScreen) { parsed.phase = lastScreen.phase; parsed.subPhase = lastScreen.subPhase; parsed.history = savedHistory; }
              else { parsed.phase = "setup"; }

              parsed.showResume = true;
              parsed._savedPhase = parsed.phase;
              parsed._savedSubPhase = parsed.subPhase;
              parsed.phase = "setup";

      var S = stateHook[0];
      var setS = stateHook[1];

      function update(partial) {
        setS(function(prev) {
          var next = Object.assign({}, prev, partial);
          // Strip large binary data before persisting to browser storage
          var toSave = Object.assign({}, next, { journalImages: [] });
          // Strip concept image if over ~500KB base64 to avoid browser storage limits
          if (toSave.conceptImage && toSave.conceptImage.data && toSave.conceptImage.data.length > 500000) {
            toSave = Object.assign({}, toSave, { conceptImage: null });
          }
          vaSave(JSON.stringify(toSave));
          return next;
        });
      }

      function updateDim(dim, partial) {
        setS(function(prev) {
          var dims = Object.assign({}, prev.dimensions);
          dims[dim] = Object.assign({}, dims[dim], partial);
          var next = Object.assign({}, prev, { dimensions: dims });
          var toSave = Object.assign({}, next, { journalImages: [] });
          // Strip concept image if over ~500KB base64 to avoid browser storage limits
          if (toSave.conceptImage && toSave.conceptImage.data && toSave.conceptImage.data.length > 500000) {
            toSave = Object.assign({}, toSave, { conceptImage: null });
          }
          vaSave(JSON.stringify(toSave));
          return next;
        });
      }

      function pushHistory() {
        setS(function(prev) {
          var h = prev.history.slice();
          h.push({ phase: prev.phase, subPhase: prev.subPhase });
          return Object.assign({}, prev, { history: h });
        });
      }

      function goBack() {
        setS(function(prev) {
          if (prev.history.length === 0) return prev;
          var h = prev.history.slice();
          var last = h.pop();
          var next = Object.assign({}, prev, { history: h, phase: last.phase, subPhase: last.subPhase, error: "" });

          }
          vaSave(JSON.stringify(toSave));
          return next;
        });
      }

      // ── Journal upload ──
      var MAX_JOURNAL_IMAGES = 20;

      function handleJournalUpload(ev) {
        var file = ev.target.files && ev.target.files[0];
        if (!file) return;
        var name = file.name.toLowerCase();
        if (name.endsWith(".docx")) {
          update({ loadingMsg: "Reading your document\u2026" });
          var reader = new FileReader();
          reader.onload = function(fileEv) {
            var arrayBuffer = fileEv.target.result;
            var collectedImages = [];
            var imageIndex = 0;

            // Custom image converter: collect base64 and insert [IMAGE N] markers
            var options = {
              convertImage: mammoth.images.imgElement(function(image) {
                imageIndex++;
                var idx = imageIndex;
                return image.read("base64").then(function(base64Data) {
                  var ct = image.contentType || "image/png";
                  // Only keep supported image types, skip wmf/emf
                  if (ct === "image/png" || ct === "image/jpeg" || ct === "image/gif" || ct === "image/webp") {
                    collectedImages.push({ index: idx, media_type: ct, data: base64Data });
                  }
                  return { src: "[IMAGE_PLACEHOLDER_" + idx + "]" };
                });
              })
            };

            mammoth.convertToHtml({ arrayBuffer: arrayBuffer }, options)
              .then(function(result) {
                // Strip HTML tags, preserving image markers
                var text = result.value
                  .replace(/<img[^>]*src="\[IMAGE_PLACEHOLDER_(\d+)\]"[^>]*>/g, "\n[IMAGE $1]\n")
                  .replace(/<br\s*\/?>/gi, "\n")
                  .replace(/<\/p>/gi, "\n\n")
                  .replace(/<[^>]+>/g, "")
                  .replace(/&amp;/g, "&")
                  .replace(/&lt;/g, "<")
                  .replace(/&gt;/g, ">")
                  .replace(/&quot;/g, '"')
                  .replace(/&#39;/g, "'")
                  .replace(/&nbsp;/g, " ")
                  .replace(/\n{3,}/g, "\n\n")
                  .trim();

                // Cap images to avoid API limits
                var images = collectedImages.slice(0, MAX_JOURNAL_IMAGES);
                var imgNote = collectedImages.length > MAX_JOURNAL_IMAGES
                  ? " (" + (collectedImages.length - MAX_JOURNAL_IMAGES) + " additional images were not included due to size limits)"
                  : "";

                update({
                  journal: Object.assign({}, S.journal, { raw: text + imgNote }),
                  journalImages: images,
                  error: ""
                });
              })
              .catch(function(err) {
                update({ error: "Couldn\u2019t read that file. Try exporting from Google Docs as .docx and uploading again. (" + err.message + ")" });
              });
          };
          reader.readAsArrayBuffer(file);
        } else if (name.endsWith(".txt")) {
          var reader = new FileReader();

        if (d.qIndex + 1 < d.questions.length) {

        } else {
          // All questions answered — generate synthesis
          pushHistory();
          update({ phase: "loading", loadingMsg: "Synthesizing your " + DIMS[dim].label.toLowerCase() + " assessment\u2026" });
          try {
            var qa = d.questions.map(function(q, i) {

      // ── Submit certainty and move to rating ──
      function setCertainty(dim, assumptionId, value) {
        var d = S.dimensions[dim];
        var updated = d.assumptions.map(function(a) {
          if (a.id === assumptionId) return Object.assign({}, a, { certainty: value });
          return a;
        });
        updateDim(dim, { assumptions: updated });
      }

      function allCertaintiesSet(dim) {
        return S.dimensions[dim].assumptions.every(function(a) { return a.certainty !== null; });
      }

      // ── Select rating ──
      function selectRating(dim, rating) {
        updateDim(dim, { rating: rating });
      }

      // ── Generate follow-ups after rating ──
      async function submitRating(dim) {
        var d = S.dimensions[dim];
        pushHistory();
        update({ phase: "loading", loadingMsg: "Preparing follow-up questions\u2026" });
        try {
          var ratingInfo = DIMS[dim].ratings[d.rating - 1];
          var assumptionSummary = d.assumptions.map(function(a) {
            return "- \"" + a.text + "\" \u2014 " + a.certainty + "% confident";
          }).join("\n");
          var context = "Dimension: " + DIMS[dim].label;
          context += "\nProject: " + S.projectName;
          context += "\n\nThe student rated their " + DIMS[dim].label.toLowerCase() + " as " + d.rating + " out of 3 (" + ratingInfo.label + ").";
          context += "\nRating description: " + ratingInfo.desc;
          context += "\n\nTheir assumption certainty ratings:\n" + assumptionSummary;
          context += "\n\nKey points from their interview:\n";
          d.questions.forEach(function(q, i) {
            context += "Q: " + q.text + "\nA: " + d.answers[i] + "\n\n";
          });
          var raw = await callClaude(context, SYSTEM_FOLLOWUP, 600);
          var parsed = JSON.parse(raw.trim());
          updateDim(dim, { followUpQuestions: parsed.questions, followUpIndex: 0, followUpAnswers: [], currentFollowUp: "" });
          update({ phase: dim, subPhase: "followups", error: "" });
        } catch (err) {
          update({ phase: dim, subPhase: "rating", error: "Something went wrong. (" + err.message + ")" });
        }
      }

      // ── Submit follow-up answer ──
      function submitFollowUp(dim) {
        var d = S.dimensions[dim];
        var newAnswers = d.followUpAnswers.concat([d.currentFollowUp]);
        updateDim(dim, { followUpAnswers: newAnswers, currentFollowUp: "" });

        if (d.followUpIndex + 1 < d.followUpQuestions.length) {
          updateDim(dim, { followUpAnswers: newAnswers, currentFollowUp: "", followUpIndex: d.followUpIndex + 1 });
        } else {
          // Dimension complete — move to next
          updateDim(dim, { followUpAnswers: newAnswers, currentFollowUp: "" });
          var idx = DIM_ORDER.indexOf(dim);
          if (idx + 1 < DIM_ORDER.length) {
            navigate(DIM_ORDER[idx + 1], "paste");
          } else {
            startSynthesis();
          }
        }
      }

      // ── Synthesis step ──
      async function startSynthesis() {
        pushHistory();
        update({ phase: "loading", loadingMsg: "Preparing synthesis questions\u2026" });
        try {
          var context = "Project: " + S.projectName + "\nDescription: " + S.projectDesc + "\n\n";
          DIM_ORDER.forEach(function(dim) {
            var d = S.dimensions[dim];
            var ratingInfo = DIMS[dim].ratings[d.rating - 1];
            context += "=== " + DIMS[dim].label.toUpperCase() + " ===\n";
            context += "Rating: " + d.rating + "/3 (" + ratingInfo.label + ")\n";
            if (d.synthesis) {
              context += "Key insight: " + (d.synthesis.synthesis || d.synthesis.unmet_need || "") + "\n";
            }
            context += "Assumptions:\n";
            d.assumptions.forEach(function(a) {
              context += "- \"" + a.text + "\" \u2014 " + a.certainty + "%\n";
            });
            context += "\n";
          });
          var raw = await callClaude(context, SYSTEM_SYNTHESIS_QUESTIONS, 800);
          var parsed = JSON.parse(raw.trim());
          update({ synthesisQuestions: parsed.questions, synthesisIndex: 0, synthesisAnswers: [], currentSynthesisAnswer: "", phase: "synthesis", subPhase: "questions", error: "" });
        } catch (err) {
          update({ phase: "viability", subPhase: "followups", error: "Something went wrong. (" + err.message + ")" });
        }
      }

      function submitSynthesisAnswer() {
        var newAnswers = S.synthesisAnswers.concat([S.currentSynthesisAnswer]);
        if (S.synthesisIndex + 1 < S.synthesisQuestions.length) {
          update({ synthesisAnswers: newAnswers, currentSynthesisAnswer: "", synthesisIndex: S.synthesisIndex + 1 });
        } else {
          // Move to concept revision instead of generating brief directly
          pushHistory();
          update({
            synthesisAnswers: newAnswers,
            currentSynthesisAnswer: "",
            conceptRevised: S.conceptRevised || S.projectDesc,
            phase: "concept-revision",
            subPhase: "revise",
            error: ""
          });
        }
      }

      // ── Concept revision follow-up ──
      async function submitConceptRevision() {
        pushHistory();
        update({ phase: "loading", loadingMsg: "One more question\u2026" });
        try {
          var prompt = SYSTEM_CONCEPT_FOLLOWUP
            .replace("{original}", S.projectDesc)
            .replace("{revised}", S.conceptRevised);
          var raw = await callClaude(
            "Original concept: " + S.projectDesc + "\n\nRevised concept: " + S.conceptRevised,
            prompt, 400
          );
          var parsed = JSON.parse(raw.trim());
          update({ phase: "concept-revision", subPhase: "reflect", conceptFollowUpQuestion: parsed.question, error: "" });
        } catch (err) {
          // If the follow-up call fails, skip to brief generation
          update({ phase: "concept-revision", subPhase: "reflect", conceptFollowUpQuestion: "What changed between your original concept and this version \u2014 and why?", error: "" });
        }
      }

      function submitConceptReflection() {
        generateBrief(S.synthesisAnswers);
      }

      // ── Brief generation ──
      async function generateBrief(synthAnswers) {
        pushHistory();
        update({ phase: "loading", loadingMsg: "Building your Venture Assessment Brief\u2026" });
        try {
          var context = buildBriefContext(synthAnswers || S.synthesisAnswers);
          var raw = await callClaude(context, SYSTEM_FINAL_BRIEF, 8000);
          var parsed = JSON.parse(raw.trim());
          update({ brief: parsed, phase: "brief", subPhase: "", error: "" });
        } catch (err) {
          update({ phase: "synthesis", subPhase: "questions", error: "Something went wrong generating the brief. (" + err.message + ")" });
        }
      }

      function buildBriefContext(synthAnswers) {
        var lines = [];

          lines.push("");

      function ratingDots(r) {
        if (r === 1) return "\u25CF\u25CB\u25CB";
        if (r === 2) return "\u25CF\u25CF\u25CB";
        return "\u25CF\u25CF\u25CF";
      }

      function getAllAssumptionsSorted() {
        var all = [];
        DIM_ORDER.forEach(function(dim) {
          S.dimensions[dim].assumptions.forEach(function(a) {
            all.push(Object.assign({}, a, { dim: dim }));
          });
        });
        all.sort(function(a, b) { return (a.certainty || 0) - (b.certainty || 0); });
        return all;
      }

      function getAvgCertainty() {
        var all = getAllAssumptionsSorted();
        if (all.length === 0) return 0;
        var sum = all.reduce(function(s, a) { return s + (a.certainty || 0); }, 0);
        return Math.round(sum / all.length);
      }

      function certClass(val) {
        if (val <= 20) return "cert-low";
        if (val <= 40) return "cert-mid";
        return "cert-high";
      }

        navigator.clipboard.writeText(buildPlainText()).then(function() {
          update({ copied: true });

      // ── DOCX EXPORT ──
      function downloadDocx() {

        var dateStr = new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
        var allA = getAllAssumptionsSorted();
        var avg = getAvgCertainty();

        function heading(text, level) {
          return new D.Paragraph({
            heading: level === 1 ? D.HeadingLevel.HEADING_1 : D.HeadingLevel.HEADING_2,
            spacing: { before: level === 1 ? 0 : 300, after: 120 },
            children: [new D.TextRun({ text: text, bold: true, font: "Arial", size: level === 1 ? 36 : 28 })]
          });
        }
        function para(text, opts) {
          opts = opts || {};
          return new D.Paragraph({
            spacing: { after: opts.after !== undefined ? opts.after : 120 },
            children: [new D.TextRun({ text: text, font: "Arial", size: 22, italics: !!opts.italic, bold: !!opts.bold, color: opts.color })]
          });
        }
        function bullet(text) {
          return new D.Paragraph({
            bullet: { level: 0 },
            spacing: { after: 60 },
            children: [new D.TextRun({ text: text, font: "Arial", size: 22 })]
          });
        }
        function divider() {
          return new D.Paragraph({
            spacing: { before: 200, after: 200 },
            border: { bottom: { style: D.BorderStyle.SINGLE, size: 6, color: "999999" } },
            children: []
          });
        }
        function ratingLabel(dim) {
          var d = S.dimensions[dim];
          var info = DIMS[dim].ratings[d.rating - 1];
          return ratingDots(d.rating) + " " + info.label + " (" + d.rating + "/3)";
        }

        var children = [];
        children.push(heading("Venture Assessment Brief", 1));
        children.push(para(S.projectName, { bold: true, after: 40 }));
        children.push(para((S.teamMembers.trim() ? S.teamMembers + " \u00B7 " : "") + dateStr, { italic: true, color: "666666", after: 40 }));

        // Concept

        // D/F/V sections
        var dimFields = {
          desirability: ["insight", "unmet_need", "implications", "gaps", "evidence_summary", "top_uncertainty"],
          feasibility: ["learning", "before_after", "maturity", "gaps", "evidence_summary", "top_uncertainty"],
          viability: ["economics", "market", "retention", "protectability", "gaps", "evidence_summary", "top_uncertainty"]
        };
        DIM_ORDER.forEach(function(dim) {
          children.push(divider());
          children.push(heading(DIMS[dim].label + " Assessment", 2));
          children.push(para(ratingLabel(dim), { bold: true }));

          if (section) {

            fields.forEach(function(field) {
              if (section[field]) {

                var label = fieldLabels[field] || field.replace(/_/g, " ").replace(/^\w/, function(c) { return c.toUpperCase(); });
                if (field === "gaps" || field === "top_uncertainty") {
                  children.push(para(label + ": " + section[field], { italic: true, color: "666666" }));
                } else {
                  children.push(para(label + ":", { bold: true, after: 40 }));
                  children.push(para(section[field]));
                }
              }
            });
          }
          // After viability body, append the Financial Model content if present
          if (dim === "viability" && S.financialModelContent) {
            children.push(new D.Paragraph({
              spacing: { before: 160, after: 60 },
              children: [new D.TextRun({ text: "Financial Model", bold: true, font: "Arial", size: 22 })]
            }));
            S.financialModelContent.split("\n").forEach(function(line) {
              children.push(new D.Paragraph({
                spacing: { after: 40 },
                children: [new D.TextRun({ text: line || " ", font: "Consolas", size: 18, color: "555555" })]
              }));
            });
          }
        });

        // Integrated Assessment
        children.push(divider());
        children.push(heading("Integrated Assessment", 2));
        if (b.synthesis.student_reflection) children.push(para(b.synthesis.student_reflection));
        if (b.synthesis.tensions) { children.push(para("Tensions:", { bold: true, after: 40 })); children.push(para(b.synthesis.tensions)); }
        if (b.synthesis.reinforcements) { children.push(para("Reinforcements:", { bold: true, after: 40 })); children.push(para(b.synthesis.reinforcements)); }
        if (b.synthesis.survival_estimate) { children.push(para("Two-Year Survival Estimate:", { bold: true, after: 40 })); children.push(para(b.synthesis.survival_estimate)); }

        // Uncertainty Map
        children.push(divider());
        children.push(heading("Uncertainty Map", 2));
        children.push(para("Average Confidence: " + avg + "%", { bold: true }));
        allA.forEach(function(a) {
          children.push(bullet(a.certainty + "% \u2014 \"" + a.text + "\" (" + DIMS[a.dim].label + ")"));
        });
        if (b.uncertainty_map && b.uncertainty_map.commentary) {
          children.push(para(b.uncertainty_map.commentary, { italic: true, color: "666666" }));
        }

        // Theoretical Foundations
        if (b.theoretical_foundations) {
          children.push(divider());
          children.push(heading("Theoretical Foundations", 2));
          if (b.theoretical_foundations.desirability) {
            children.push(new D.Paragraph({
              spacing: { before: 160, after: 60 },
              children: [new D.TextRun({ text: "Desirability", bold: true, font: "Arial", size: 22 })]
            }));
            children.push(para(b.theoretical_foundations.desirability));
          }
          if (b.theoretical_foundations.feasibility) {
            children.push(new D.Paragraph({
              spacing: { before: 160, after: 60 },
              children: [new D.TextRun({ text: "Feasibility", bold: true, font: "Arial", size: 22 })]
            }));
            children.push(para(b.theoretical_foundations.feasibility));
          }
          if (b.theoretical_foundations.viability) {
            children.push(new D.Paragraph({
              spacing: { before: 160, after: 60 },

            }));

        // Next Steps

        children.push(heading("Recommended Next Steps", 2));

        });

        // Footer

        children.push(para("Generated with ENDURE Venture Assessment Tool \u00B7 " + dateStr, { italic: true, color: "999999" }));

        var doc = new D.Document({
          sections: [{
            properties: { page: { margin: { top: 1440, bottom: 1440, left: 1440, right: 1440 } } },
            children: children
          }]
        });

        D.Packer.toBlob(doc).then(function(blob) {
          var slug = S.projectName.replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase();
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "venture-assessment-" + slug + ".docx";
          a.click();
          URL.revokeObjectURL(a.href);
        });
      }

      // ── PPTX EXPORT ──
      // Strip control chars and ensure clean text for PPTX XML
      function pptxSafe(text) {
        if (!text) return "";
        return String(text)
          .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, "")  // strip control chars
          .replace(/\r\n/g, "\n")  // normalize line endings
          .replace(/\r/g, "\n");
      }
      // Shorten text at a sentence or word boundary so a slide never cuts mid-word
      function clip(text, max) {
        text = String(text || "").trim();
        if (text.length <= max) return text;
        var cut = text.substring(0, max);
        var sentence = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("? "), cut.lastIndexOf("! "));
        if (sentence > max * 0.5) return cut.substring(0, sentence + 1);
        var space = cut.lastIndexOf(" ");
        return (space > 0 ? cut.substring(0, space) : cut).replace(/[\s,;:\u2014-]+$/, "") + "\u2026";
      }
      // Sanitize a rich text array (array of arrays with {text, options})
      function pptxSafeRich(rows) {
        return rows.map(function(row) {
          return row.map(function(part) {
            return Object.assign({}, part, { text: pptxSafe(part.text) });
          });
        });
      }

      function generatePPTX() {
        if (!S.brief) return;
        var b = S.brief;
        var pptx = new PptxGenJS();
        var allA = getAllAssumptionsSorted();
        var avg = getAvgCertainty();
        var dateStr = new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });

        // Theme colors
        var BG = "0D1117";
        var CREAM = "E8E3D8";
        var GOLD = "D4A853";
        var MUTED = "8A857A";
        var GREEN = "5CB88A";
        var RED = "E07558";

        pptx.defineLayout({ name: "WIDE", width: 13.33, height: 7.5 });
        pptx.layout = "WIDE";

        function addSlide(titleText) {
          var slide = pptx.addSlide();
          slide.background = { fill: BG };
          // Footer bar
          slide.addText("ENDURE Venture Assessment", { x: 0.6, y: 6.9, w: 5, h: 0.4, fontSize: 8, fontFace: "Arial", color: MUTED, italic: true });
          return slide;
        }

        function slideTitle(slide, text, opts) {
          opts = opts || {};
          slide.addText(pptxSafe(text), {
            x: opts.x || 0.6, y: opts.y || 0.4, w: opts.w || 12, h: 0.7,
            fontSize: opts.size || 28, fontFace: "Arial", color: GOLD, bold: true
          });
        }

        function slideBody(slide, text, opts) {
          opts = opts || {};
          slide.addText(pptxSafe(text), {
            x: opts.x || 0.6, y: opts.y || 1.3, w: opts.w || 11.4, h: opts.h || 5,
            fontSize: opts.size || 14, fontFace: "Arial", color: opts.color || CREAM,
            valign: opts.valign || "top", lineSpacingMultiple: 1.5, italic: !!opts.italic
          });
        }

        // ── SLIDE 1: Title ──
        var s1 = addSlide();
        s1.addText(pptxSafe(S.projectName), { x: 0.6, y: 1.8, w: 12, h: 1.2, fontSize: 44, fontFace: "Arial", bold: true, color: CREAM });
        if (S.teamMembers.trim()) {
          s1.addText(S.teamMembers, { x: 0.6, y: 3.1, w: 12, h: 0.5, fontSize: 16, fontFace: "Arial", color: MUTED });
        }
        s1.addText(dateStr, { x: 0.6, y: 3.7, w: 12, h: 0.4, fontSize: 12, fontFace: "Arial", color: MUTED, italic: true });
        s1.addText("ENDURE Venture Assessment", { x: 0.6, y: 4.4, w: 12, h: 0.4, fontSize: 12, fontFace: "Arial", color: GOLD, letterSpacing: 3 });
        s1.addShape(pptx.ShapeType.rect, { x: 0.6, y: 1.5, w: 2, h: 0.06, fill: { color: GOLD } });

        // ── SLIDE 2: The Concept ──
        var s2 = addSlide();
        slideTitle(s2, "The Concept");
        var hasConceptImg = S.conceptImage && S.conceptImage.data;
        var s2TextW = hasConceptImg ? 6.5 : 11.4;
        s2.addText(pptxSafe(S.conceptRevised || S.projectDesc), {
          x: 0.6, y: 1.4, w: s2TextW, h: 2.5,
          fontSize: 20, fontFace: "Arial", color: CREAM, lineSpacingMultiple: 1.6, valign: "top"
        });
        if (hasConceptImg) {
          s2.addImage({
            data: "data:" + S.conceptImage.media_type + ";base64," + S.conceptImage.data,
            x: 7.8, y: 1.2, w: 5, h: 3.5,
            sizing: { type: "contain", w: 5, h: 3.5 }
          });
        }
        if (b.desirability && b.desirability.unmet_need) {
          s2.addShape(pptx.ShapeType.rect, { x: 0.6, y: hasConceptImg ? 5.0 : 4.2, w: 11.4, h: 0.02, fill: { color: MUTED } });
          s2.addText(pptxSafe(b.desirability.unmet_need), {
            x: 0.6, y: hasConceptImg ? 5.2 : 4.4, w: 11.4, h: 1.5,
            fontSize: 14, fontFace: "Arial", color: GOLD, italic: true, lineSpacingMultiple: 1.5, valign: "top"
          });
        }
        s2.notes = "Open with your concept statement. Then read the unmet need framing \u2014 this anchors everything that follows.";

        // Helper: add labeled paragraphs to a slide using simple addText calls (avoids rich-text XML bugs)
        function addLabeledBlock(slide, yStart, items) {
          var y = yStart;
          items.forEach(function(item) {
            if (!item.text) return;
            var text = pptxSafe(item.text);
            // About 125 characters fit on one 12pt line across 11.4in; a line is about 0.24in tall
            var lines = Math.max(1, Math.ceil(text.length / 125));
            var h = Math.max(0.34, lines * 0.24 + 0.1);
            slide.addText(pptxSafe(item.label), {
              x: 0.6, y: y, w: 11.4, h: 0.3,
              fontSize: 12, fontFace: "Arial", color: GOLD, bold: true, valign: "top"
            });
            slide.addText(text, {
              x: 0.6, y: y + 0.3, w: 11.4, h: h,
              fontSize: 12, fontFace: "Arial", color: item.color || CREAM, italic: !!item.italic, valign: "top", lineSpacingMultiple: 1.4
            });
            y += 0.3 + h + 0.22;
          });
        }

        // ── SLIDE 3: The Customer ──
        var s3 = addSlide();
        slideTitle(s3, "The Person");
        var dAns = S.dimensions.desirability.answers;
        var dSyn = S.dimensions.desirability.synthesis;
        var custItems = [];
        if (dAns[0]) custItems.push({ label: "Who:", text: clip(dAns[0], 250) });
        if (dAns[1]) custItems.push({ label: "Current behavior:", text: clip(dAns[1], 250) });
        if (dAns[2]) custItems.push({ label: "What they value:", text: clip(dAns[2], 250) });
        if (dSyn && dSyn.synthesis) custItems.push({ label: "Insight:", text: clip(dSyn.synthesis, 300), italic: true });
        // Fallback to brief
        if (custItems.length === 0 && b.desirability) {
          if (b.desirability.insight) custItems.push({ label: "Insight:", text: clip(b.desirability.insight, 400), h: 1.5 });
          if (b.desirability.evidence_summary) custItems.push({ label: "Evidence:", text: clip(b.desirability.evidence_summary, 300), italic: true });
          if (b.desirability.top_uncertainty) custItems.push({ label: "Key uncertainty:", text: clip(b.desirability.top_uncertainty, 250) });
        }
        addLabeledBlock(s3, 1.3, custItems);
        var dRC = S.dimensions.desirability.synthesis && S.dimensions.desirability.synthesis.reading_connection;
        s3.notes = "Describe the specific person you designed for. What do they currently do? What did you learn about what they actually value?" + (dRC ? "\n\nTheory connection: " + dRC.text : "");

        // ── SLIDE 4: What We Tested ──
        var s4 = addSlide();
        slideTitle(s4, "What I Tested");
        var fAns = S.dimensions.feasibility.answers;
        var fSyn = S.dimensions.feasibility.synthesis;
        var testItems = [];
        if (fAns[0]) testItems.push({ label: "Experiment:", text: clip(fAns[0], 250) });
        if (fAns[1]) testItems.push({ label: "Prediction:", text: clip(fAns[1], 250) });
        if (fAns[2]) testItems.push({ label: "What happened:", text: clip(fAns[2], 250) });
        if (fSyn && fSyn.maturity) testItems.push({ label: "Maturity:", text: fSyn.maturity, color: fSyn.maturity === "Concept" ? RED : fSyn.maturity === "Validated direction" ? GREEN : GOLD, h: 0.4 });
        // Fallback to brief
        if (testItems.length === 0 && b.feasibility) {
          if (b.feasibility.learning) testItems.push({ label: "What I learned:", text: clip(b.feasibility.learning, 400), h: 1.5 });
          if (b.feasibility.before_after) testItems.push({ label: "Prediction vs reality:", text: clip(b.feasibility.before_after, 300) });
          if (b.feasibility.maturity) testItems.push({ label: "Maturity:", text: b.feasibility.maturity, color: b.feasibility.maturity === "Concept" ? RED : b.feasibility.maturity === "Validated direction" ? GREEN : GOLD, h: 0.4 });
        }
        addLabeledBlock(s4, 1.3, testItems);
        var fRC = S.dimensions.feasibility.synthesis && S.dimensions.feasibility.synthesis.reading_connection;
        s4.notes = "Walk through your experiment: what you predicted, what happened, and what you learned. Honest failure is strong evidence." + (fRC ? "\n\nTheory connection: " + fRC.text : "");

        // ── SLIDE 5: The Economics ──
        var s5 = addSlide();
        slideTitle(s5, "Does It Pay for Itself?");
        var vSyn = S.dimensions.viability.synthesis;
        var econItems = [];
        if (S.unitEconomicsResults) {
          var ueR = S.unitEconomicsResults;
          var pfiR = ueR.pays_for_itself || {};
          econItems.push({ label: "Verdict:", text: clip(((pfiR.verdict || "") + " - " + (pfiR.sentence || "")), 240) });
          econItems.push({ label: "Money in / out:", text: fmtRange(ueR.money_in) + " in, " + fmtRange(ueR.money_out) + " out, a year", h: 0.4 });
        }
        if (S.tamSamResults) {
          var tamR = S.tamSamResults;
          econItems.push({ label: "Could reach:", text: clip((tamR.tam.value || ""), 200) });
          econItems.push({ label: "First year:", text: clip((tamR.year_one_target.value || ""), 200) });
        }
        // Fallback to brief
        if (econItems.length === 0 && b.viability) {
          if (b.viability.economics) econItems.push({ label: "Economics:", text: clip(b.viability.economics, 400), h: 1.5 });
          if (b.viability.market) econItems.push({ label: "Reach:", text: clip(b.viability.market, 300) });
        } else if (!S.tamSamResults && vSyn && vSyn.tam_sam) {
          econItems.push({ label: "Reach:", text: clip((vSyn.tam_sam.description || ""), 250) });
          if (vSyn.tam_sam.year_one) econItems.push({ label: "First year:", text: clip(vSyn.tam_sam.year_one, 200) });
        }
        if (b.viability && b.viability.retention) econItems.push({ label: "Why it keeps getting funded:", text: clip(b.viability.retention, 200) });
        addLabeledBlock(s5, 1.3, econItems);
        var vRC = S.dimensions.viability.synthesis && S.dimensions.viability.synthesis.reading_connection;
        s5.notes = "Lead with your \u201cThis pays for itself if\u201d sentence. Then show what one unit costs, which college number it changes, and how far it could reach." + (vRC ? "\n\nTheory connection: " + vRC.text : "");

        // ── SLIDE 6: Our Assessment ──
        var s6 = addSlide();
        slideTitle(s6, "My Assessment");
        var ratingLabels = { 1: "Significant limitations", 2: "Manageable limitations", 3: "Unique advantage" };
        var ratingColors = { 1: RED, 2: GOLD, 3: GREEN };
        var yPos = 1.5;
        DIM_ORDER.forEach(function(dim) {
          var d = S.dimensions[dim];
          var r = d.rating;
          // Dimension label
          s6.addText(DIMS[dim].label.toUpperCase(), {
            x: 0.6, y: yPos, w: 3, h: 0.4,
            fontSize: 11, fontFace: "Arial", color: MUTED, letterSpacing: 2, bold: true
          });
          // Rating dots + label
          s6.addText(ratingDots(r) + "  " + ratingLabels[r], {
            x: 3.8, y: yPos, w: 4, h: 0.4,
            fontSize: 14, fontFace: "Arial", color: ratingColors[r], bold: true
          });
          // Evidence from follow-ups
          var evidence = d.followUpAnswers[0] || "";
          if (evidence) {
            s6.addText(pptxSafe(clip(evidence, 200)), {
              x: 0.6, y: yPos + 0.45, w: 11.4, h: 0.9,
              fontSize: 11, fontFace: "Arial", color: MUTED, italic: true, lineSpacingMultiple: 1.4, valign: "top"
            });
          }
          yPos += evidence ? 1.6 : 0.8;
        });
        s6.notes = "This is the centerpiece. Walk through each dimension: your rating, and the evidence behind it. Be honest about limitations.";

        // ── SLIDE 7: Certainty & Uncertainty ──
        var s7 = addSlide();
        slideTitle(s7, "What I\u2019m Sure and Unsure About");
        // Average confidence
        s7.addText(avg + "%", { x: 0.6, y: 1.3, w: 3, h: 0.8, fontSize: 36, fontFace: "Arial", color: GOLD, bold: true });
        s7.addText("average confidence across " + allA.length + " assumptions", { x: 0.6, y: 2.0, w: 5, h: 0.4, fontSize: 11, fontFace: "Arial", color: MUTED });

        var highConf = allA.filter(function(a) { return a.certainty >= 60; });
        var lowConf = allA.filter(function(a) { return a.certainty < 60; });

        // Truncate assumption text to ~80 chars to prevent overflow
        function truncAssumption(text) { return clip(text, 95); }
        // Limit to top 3 each to fit on one slide
        var maxItems = 3;
        var aY = 2.7;
        if (highConf.length > 0) {
          s7.addText("HIGHER CONFIDENCE", { x: 0.6, y: aY, w: 5, h: 0.3, fontSize: 9, fontFace: "Arial", color: GREEN, letterSpacing: 2, bold: true });
          aY += 0.4;
          highConf.slice(0, maxItems).forEach(function(a) {
            s7.addText(pptxSafe(a.certainty + "%  " + truncAssumption(a.text)), { x: 0.6, y: aY, w: 8, h: 0.4, fontSize: 10, fontFace: "Arial", color: CREAM });
            s7.addText(DIMS[a.dim].label, { x: 9, y: aY, w: 2, h: 0.4, fontSize: 9, fontFace: "Arial", color: MUTED, italic: true });
            aY += 0.5;
          });
          aY += 0.15;
        }
        if (lowConf.length > 0) {
          s7.addText("LOWER CONFIDENCE", { x: 0.6, y: aY, w: 5, h: 0.3, fontSize: 9, fontFace: "Arial", color: RED, letterSpacing: 2, bold: true });
          aY += 0.4;
          lowConf.slice(0, maxItems).forEach(function(a) {
            s7.addText(pptxSafe(a.certainty + "%  " + truncAssumption(a.text)), { x: 0.6, y: aY, w: 8, h: 0.4, fontSize: 10, fontFace: "Arial", color: CREAM });
            s7.addText(DIMS[a.dim].label, { x: 9, y: aY, w: 2, h: 0.4, fontSize: 9, fontFace: "Arial", color: MUTED, italic: true });
            aY += 0.5;
          });
        }
        s7.notes = "Walk through your highest and lowest confidence assumptions. Explain why the low-confidence ones matter \u2014 are they critical to your concept or manageable risks?";

        // ── SLIDE 8: The Honest Bet ──
        var s8 = addSlide();
        slideTitle(s8, "The Honest Bet");
        s8.addText("Will this be running at Lewis & Clark in two years?", {
          x: 0.6, y: 1.5, w: 11.8, h: 0.6,
          fontSize: 16, fontFace: "Arial", color: MUTED, italic: true
        });
        if (b.synthesis && b.synthesis.survival_estimate) {
          s8.addText(pptxSafe(clip(b.synthesis.survival_estimate, 600)), {
            x: 0.6, y: 2.4, w: 11.4, h: 3.5,
            fontSize: 16, fontFace: "Arial", color: CREAM, lineSpacingMultiple: 1.6, valign: "top"
          });
        }
        s8.notes = "Share your honest probability estimate. Explain what would change it \u2014 up or down. This is the superforecasting capstone.";

        // ── SLIDE 9: What We'd Do Next ──
        var s9 = addSlide();
        slideTitle(s9, "What I\u2019d Do Next");
        s9.addText("If I had another semester, here\u2019s where I\u2019d focus:", {
          x: 0.6, y: 1.3, w: 11.8, h: 0.5,
          fontSize: 13, fontFace: "Arial", color: MUTED, italic: true
        });
        var nextY = 2.1;
        (b.next_steps || []).forEach(function(step, i) {
          s9.addText((i + 1) + ".", { x: 0.6, y: nextY, w: 0.5, h: 0.6, fontSize: 18, fontFace: "Arial", color: GOLD, bold: true, valign: "top" });
          s9.addText(pptxSafe(clip(step, 250)), { x: 1.2, y: nextY, w: 10.8, h: 0.8, fontSize: 14, fontFace: "Arial", color: CREAM, lineSpacingMultiple: 1.4, valign: "top" });
          nextY += 1.1;
        });
        // Closing thought from synthesis
        if (b.synthesis && b.synthesis.student_reflection) {
          s9.addShape(pptx.ShapeType.rect, { x: 0.6, y: nextY + 0.2, w: 11.4, h: 0.02, fill: { color: MUTED } });
          s9.addText(pptxSafe(clip(b.synthesis.student_reflection, 300)), {
            x: 0.6, y: nextY + 0.5, w: 11.4, h: 0.9,
            fontSize: 12, fontFace: "Arial", color: MUTED, italic: true, lineSpacingMultiple: 1.5, valign: "top"

      function currentStepIndex() {
        var p = S.phase;
        if (p === "setup" || p === "loading") {
          // Determine which step is active based on what's complete
          if (S.dimensions.viability.followUpAnswers.length > 0) return 3;
          if (S.dimensions.feasibility.followUpAnswers.length > 0) return 2;
          if (S.dimensions.desirability.followUpAnswers.length > 0) return 1;
          return 0;
        }
        var idx = DIM_ORDER.indexOf(p);
        if (idx >= 0) return idx;
        if (p === "synthesis") return 3;
        if (p === "concept-revision") return 4;
        if (p === "brief") return 5;
        return 0;
      }

        return e("div", { className: "step-bar no-print" }, items);

        var cfg = DIMS[dim];

        var sub = S.subPhase;

        // Viability sub-phase routing for inline tools
        if (dim === "viability") {
          if (sub === "ue-review") return renderUeReview();
          if (sub === "ue-interview") return renderUeInlineInterview();
          if (sub === "ue-results") return renderUeResults();
          if (sub === "tam-review") return renderTamReview();
          if (sub === "tam-interview") return renderTamInlineInterview();
          if (sub === "tam-results") return renderTamResults();
          if (sub === "fm-review") return renderFmReview();
        }

        if (sub === "paste") return renderPaste(dim, cfg, d);
        if (sub === "questions") return renderQuestions(dim, cfg, d);
        if (sub === "ai-synthesis") return renderSynthesisDisplay(dim, cfg, d);
        if (sub === "assumption-certainty") return renderAssumptionCertainty(dim, cfg, d);
        if (sub === "rating") return renderRating(dim, cfg, d);
        if (sub === "followups") return renderFollowUps(dim, cfg, d);
        return renderPaste(dim, cfg, d);

              value: d.currentAnswer,

                className: "btn",

      // ── Synthesis display ──
      function renderSynthesisDisplay(dim, cfg, d) {
        var syn = d.synthesis;
        if (!syn) return renderLoading();

        var cards = [];
        // Main synthesis
        cards.push(e("div", { key: "main", className: "synthesis-card" },
          e("div", { className: "synthesis-label" }, "AI Synthesis"),
          e("div", { className: "synthesis-text" }, syn.synthesis || syn.before_after || "")
        ));
        // Unmet need (desirability)
        if (syn.unmet_need) {
          cards.push(e("div", { key: "need", className: "unmet-need" }, syn.unmet_need));
        }
        // Design implications (desirability)
        if (syn.design_implications) {
          cards.push(e("div", { key: "impl", className: "synthesis-card" },
            e("div", { className: "synthesis-label" }, "Design Implications"),
            e("div", { className: "synthesis-text" },
              Array.isArray(syn.design_implications) ? syn.design_implications.join("\n\n") : syn.design_implications
            )
          ));
        }
        // Before/after (feasibility)
        if (syn.before_after && syn.synthesis) {
          cards.push(e("div", { key: "ba", className: "synthesis-card" },
            e("div", { className: "synthesis-label" }, "Prediction vs Reality"),
            e("div", { className: "synthesis-text" }, syn.before_after)
          ));
        }
        // Feasibility paragraph
        if (syn.feasibility_paragraph) {
          cards.push(e("div", { key: "fp", className: "synthesis-card" },
            e("div", { className: "synthesis-label" }, "Feasibility Assessment"),
            e("div", { className: "synthesis-text" }, syn.feasibility_paragraph)
          ));
        }
        // Maturity badge (feasibility)
        if (syn.maturity) {
          var mClass = "maturity-badge ";
          if (syn.maturity === "Concept") mClass += "maturity-concept";
          else if (syn.maturity === "Early test") mClass += "maturity-early";
          else mClass += "maturity-validated";
          cards.push(e("div", { key: "mat" }, e("span", { className: mClass }, syn.maturity)));
        }
        // TAM/SAM (viability)
        if (syn.tam_sam) {
          cards.push(e("div", { key: "tam", className: "synthesis-card" },
            e("div", { className: "synthesis-label" }, "Reach"),
            e("div", { className: "synthesis-text" }, syn.tam_sam.description),
            syn.tam_sam.year_one ? e("div", { className: "synthesis-text", style: { marginTop: 8 } }, "First year: " + syn.tam_sam.year_one) : null
          ));
        }
        // Retention (viability)
        if (syn.retention) {
          cards.push(e("div", { key: "ret", className: "synthesis-card" },
            e("div", { className: "synthesis-label" }, "Why It Keeps Getting Funded"),
            e("div", { className: "synthesis-text" }, syn.retention)
          ));
        }
        // Gaps
        if (syn.gaps) {
          cards.push(e("div", { key: "gaps", className: "gaps-text" }, "What you still don\u2019t know: " + syn.gaps));
        }

        return e("div", null,
          renderHeader(),
          e("main", { className: "main" },
            renderStepBar(),
            renderBackButton(),
            e("div", { className: "eyebrow" }, cfg.label + " \u2014 What we heard"),
            e("div", { className: "dim-body" }, "Here\u2019s what emerged from your answers. Review this, then you\u2019ll rate your confidence in the key assumptions."),
            cards,
            syn.reading_connection ? e("div", { className: "reading-connection" },
              e("div", { className: "reading-connection-label" }, "Connecting to Theory"),
              e("div", { className: "reading-connection-text" }, syn.reading_connection.text),
              syn.reading_connection.sources && syn.reading_connection.sources.length > 0 ?
                e("div", { className: "reading-connection-sources" },
                  "\u2014 " + syn.reading_connection.sources.map(function(s) {
                    return s.author + ", " + s.title + (s.year ? " (" + s.year + ")" : "");
                  }).join("; ")
                ) : null
            ) : null,
            e("div", { style: { marginTop: 32 } },
              e("button", {
                className: "btn",
                onClick: function() { navigate(dim, "assumption-certainty"); }
              }, "Rate Your Assumptions \u2192")
            )
          )
        );
      }

      // ── Assumption certainty ──
      function renderAssumptionCertainty(dim, cfg, d) {
        return e("div", null,
          renderHeader(),
          e("main", { className: "main" },
            renderStepBar(),
            renderBackButton(),
            e("div", { className: "eyebrow" }, cfg.label + " \u2014 Assumption Check"),

                      return e("button", {

            e("button", {
              className: "btn",
              disabled: d.rating === 0,
              onClick: function() { submitRating(dim); }

      }

              e("div", { className: "eyebrow" }, "Concept Revision"),

        var avg = getAvgCertainty();

          var d = S.dimensions[dim];
          var rInfo = DIMS[dim].ratings[d.rating - 1];
          return e("div", { key: dim, className: "brief-section" },
            e("div", { className: "brief-section-title" }, title),
            e("div", { className: "rating-badge rating-badge-" + d.rating },
              ratingDots(d.rating) + " " + rInfo.label
            ),
            content
          );
        }

        return e("div", null,
          renderHeader(),
          e("main", { className: "main" },
            renderStepBar(),

            // Header
            e("div", { className: "brief-header" },
              e("div", { className: "eyebrow" }, S.projectName),
              e("div", { className: "brief-title" }, "Venture Assessment Brief"),
              e("div", { className: "brief-meta" },
                (S.teamMembers.trim() ? S.teamMembers + " \u00B7 " : "") +

                e("div", { className: "brief-text", style: { fontSize: 16 } },

                ),
                S.conceptImage ? e("div", { style: { clear: "both" } }) : null
              ),
              S.conceptRevised && S.conceptRevised !== S.projectDesc ? e("div", { className: "brief-card", style: { opacity: 0.6 } },
                e("div", { className: "synthesis-label" }, "Original Concept"),
                e("div", { className: "brief-text" }, S.projectDesc)

              )
            ),

                allA.map(function(a, i) {
                  return e("div", { key: i, className: "uncertainty-item" },
                    e("span", { className: "uncertainty-cert " + certClass(a.certainty) }, a.certainty + "%"),
                    e("span", { className: "uncertainty-text" }, a.text),
                    e("span", { className: "uncertainty-dim" }, DIMS[a.dim].label)
                  );
                }),
                b.uncertainty_map && b.uncertainty_map.commentary ? e("div", { className: "brief-text", style: { marginTop: 16, paddingTop: 16, borderTop: "1px solid rgba(232,227,216,0.06)" } },
                  b.uncertainty_map.commentary
                ) : null
              )
            ),

            // Theoretical Foundations
            b.theoretical_foundations ? e("div", { className: "brief-section" },
              e("div", { className: "brief-section-title" }, "Theoretical Foundations"),
              e("div", { className: "brief-card" },
                b.theoretical_foundations.desirability ? e("div", null,
                  e("div", { className: "synthesis-label", style: { marginBottom: 6 } }, "Desirability"),
                  e("div", { className: "brief-text", style: { marginBottom: 16 } }, b.theoretical_foundations.desirability)
                ) : null,
                b.theoretical_foundations.feasibility ? e("div", null,
                  e("div", { className: "synthesis-label", style: { marginBottom: 6 } }, "Feasibility"),
                  e("div", { className: "brief-text", style: { marginBottom: 16 } }, b.theoretical_foundations.feasibility)
                ) : null,
                b.theoretical_foundations.viability ? e("div", null,
                  e("div", { className: "synthesis-label", style: { marginBottom: 6 } }, "Viability"),
                  e("div", { className: "brief-text" }, b.theoretical_foundations.viability)
                ) : null
              )
            ) : null,

            // Next Steps
            e("div", { className: "brief-section" },
              e("div", { className: "brief-section-title" }, "Recommended Next Steps"),
              e("div", { className: "brief-card" },
                (b.next_steps || []).map(function(step, i) {
                  return e("div", { key: i, style: { display: "flex", gap: 12, marginBottom: i < (b.next_steps.length - 1) ? 12 : 0 } },
                    e("span", { style: { fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, fontWeight: 600, color: "#D4A853" } }, (i + 1) + "."),
                    e("span", { className: "brief-text" }, step)
                  );
                })
              )
            ),

            // Footer
            e("div", { style: { fontSize: 12, color: "rgba(232,227,216,0.25)", textAlign: "center", marginTop: 40, paddingTop: 20, borderTop: "1px solid rgba(232,227,216,0.06)" } },
              "Generated with ENDURE Venture Assessment Tool \u00B7 " +
              new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }),
              e("br"),
              "This assessment reflects the student\u2019s reasoning and evidence as of this date."
            ),

            // Actions
            e("div", { className: "actions no-print", style: { marginTop: 32 } },
              e("button", { className: "btn", onClick: downloadDocx }, "Download Brief"),
              e("button", { className: "btn", onClick: generatePPTX }, "Download Deck"),
              e("button", {
                className: "btn btn-ghost btn-copy" + (S.copied ? " copied" : ""),
                onClick: copyToClipboard
              }, S.copied ? "Copied!" : "Copy Text"),
              e("button", { className: "btn btn-ghost", onClick: function() { window.print(); } }, "Print"),
              e("button", { className: "btn btn-ghost", onClick: startFresh }, "Start Over")
            )
          )
        );
      }

      // ═══════════════════════════════════════
      // MAIN RENDER
      // ═══════════════════════════════════════
      if (S.phase === "loading") return renderLoading();
      if (S.phase === "setup") return renderSetup();
      if (S.phase === "brief") return renderBrief();
      if (S.phase === "concept-revision") return renderConceptRevision();
      if (S.phase === "synthesis") return renderSynthesis();
      if (DIM_ORDER.indexOf(S.phase) >= 0) return renderDimension(S.phase);
      return renderSetup();
    }

    var root = ReactDOM.createRoot(document.getElementById("app"));
    root.render(e(App));
  </script>
</body>
</html>
