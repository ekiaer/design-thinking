<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ENDURE · One Unit and What It Costs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0D1117;
      color: #E8E3D8;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    .header {
      border-bottom: 1px solid rgba(212,168,83,0.18);
      padding: 18px 40px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-mark {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 20px;
      font-weight: 600;
      color: #D4A853;
      letter-spacing: -1px;
    }
    .header-sub {
      font-size: 12px;
      font-weight: 300;
      color: rgba(232,227,216,0.4);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .main {
      max-width: 780px;
      margin: 0 auto;
      padding: 48px 40px 80px;
    }

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #D4A853;
      margin-bottom: 16px;
    }
    .intro-heading {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      line-height: 1.1;
      font-weight: 400;
      margin-bottom: 22px;
    }
    .intro-body {
      color: rgba(232,227,216,0.6);
      max-width: 560px;
      line-height: 1.75;
      margin-bottom: 16px;
    }
    .step-heading {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      line-height: 1.25;
      font-weight: 400;
      margin-bottom: 10px;
    }
    .step-body {
      font-size: 14px;
      color: rgba(232,227,216,0.58);
      line-height: 1.7;
      max-width: 620px;
      margin-bottom: 26px;
    }

    /* ── STEP BAR ── */
    .steps {
      display: flex;
      gap: 6px;
      margin-bottom: 40px;
    }
    .step-seg { flex: 1; }
    .step-line {
      height: 3px;
      border-radius: 2px;
      background: rgba(232,227,216,0.08);
      margin-bottom: 8px;
    }
    .step-seg.active .step-line { background: #D4A853; }
    .step-seg.done .step-line { background: rgba(212,168,83,0.35); }
    .step-name {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(232,227,216,0.25);
    }
    .step-seg.active .step-name { color: #D4A853; }
    .step-seg.done .step-name { color: rgba(212,168,83,0.5); }

    /* ── CARDS AND FORMS ── */
    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(232,227,216,0.08);
      border-radius: 8px;
      padding: 28px;
      margin-bottom: 24px;
    }
    .card.quiet { background: rgba(255,255,255,0.015); }
    .form-group { margin-bottom: 22px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(212,168,83,0.8);
      margin-bottom: 8px;
    }
    .form-hint {
      font-size: 12.5px;
      color: rgba(232,227,216,0.42);
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(232,227,216,0.12);
      border-radius: 4px;
      color: #E8E3D8;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      padding: 11px 13px;
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
    }
    .form-input:focus { border-color: rgba(212,168,83,0.55); }
    .form-input::placeholder { color: rgba(232,227,216,0.22); }
    select.form-input { appearance: none; -webkit-appearance: none; cursor: pointer; }
    select.form-input option { background: #0D1117; color: #E8E3D8; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .nudge {
      font-size: 13px;
      color: #E0A458;
      background: rgba(224,164,88,0.07);
      border-left: 2px solid rgba(224,164,88,0.5);
      padding: 10px 14px;
      border-radius: 0 4px 4px 0;
      margin-top: 10px;
    }

    .sentence {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      line-height: 1.4;
      color: #E8E3D8;
      border-left: 3px solid #D4A853;
      padding: 6px 0 6px 18px;
      margin-bottom: 24px;
    }
    .sentence.empty { color: rgba(232,227,216,0.28); font-style: italic; }
    .sentence-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(212,168,83,0.65);
      margin-bottom: 8px;
    }

    .examples { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .examples li { font-size: 13.5px; color: rgba(232,227,216,0.62); }
    .examples b { color: #D4A853; font-weight: 500; }

    .ref-table { width: 100%; border-collapse: collapse; }
    .ref-table td {
      padding: 7px 0;
      font-size: 13px;
      color: rgba(232,227,216,0.55);
      border-bottom: 1px solid rgba(232,227,216,0.05);
      vertical-align: top;
    }
    .ref-table tr:last-child td { border-bottom: none; }
    .ref-table td:first-child {
      font-family: 'IBM Plex Mono', monospace;
      color: #E8E3D8;
      white-space: nowrap;
      padding-right: 18px;
    }
    .fine {
      font-size: 11.5px;
      color: rgba(232,227,216,0.32);
      margin-top: 10px;
    }

    /* ── CHOICE CARDS ── */
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
    .choices.six { grid-template-columns: 1fr 1fr 1fr; }
    .choice {
      text-align: left;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(232,227,216,0.1);
      border-radius: 8px;
      padding: 20px;
      color: inherit;
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.55;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .choice:hover { border-color: rgba(212,168,83,0.4); }
    .choice.on { border-color: #D4A853; background: rgba(212,168,83,0.07); }
    .choice-title {
      font-family: 'Playfair Display', serif;
      font-size: 19px;
      color: #E8E3D8;
      margin-bottom: 8px;
      line-height: 1.25;
    }
    .choices.six .choice-title { font-size: 16px; }
    .choice-body { color: rgba(232,227,216,0.55); }
    .choice-then {
      margin-top: 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 0.04em;
      color: rgba(212,168,83,0.75);
    }

    /* ── COST LINES ── */
    .stage {
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(232,227,216,0.08);
      border-radius: 8px;
      padding: 22px 22px 18px;
      margin-bottom: 16px;
    }
    .stage-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    .stage-num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(212,168,83,0.6);
    }
    .stage-name { font-family: 'Playfair Display', serif; font-size: 21px; }
    .stage-total {
      margin-left: auto;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: rgba(232,227,216,0.5);
    }
    .stage-q { font-size: 13px; color: rgba(232,227,216,0.55); margin-bottom: 2px; }
    .stage-eg { font-size: 12px; color: rgba(232,227,216,0.32); font-style: italic; margin-bottom: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: transparent;
      border: 1px dashed rgba(212,168,83,0.35);
      color: rgba(212,168,83,0.85);
      border-radius: 20px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      padding: 5px 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .chip:hover { background: rgba(212,168,83,0.08); border-color: rgba(212,168,83,0.7); }

    .line {
      display: grid;
      grid-template-columns: 116px 1fr 84px 84px 28px;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }
    .line .form-input { padding: 8px 10px; font-size: 14px; }
    .line-wrap { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid rgba(232,227,216,0.05); }
    .line-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .line-foot-label { font-size: 12px; color: rgba(232,227,216,0.4); }
    .seg { display: inline-flex; border: 1px solid rgba(232,227,216,0.14); border-radius: 4px; overflow: hidden; }
    .seg button {
      background: transparent;
      border: none;
      color: rgba(232,227,216,0.45);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 0.03em;
      padding: 5px 10px;
      cursor: pointer;
    }
    .seg button.on { background: rgba(212,168,83,0.16); color: #D4A853; }
    .x-btn {
      background: transparent;
      border: none;
      color: rgba(232,227,216,0.3);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
    }
    .x-btn:hover { color: #E07558; }
    .col-heads {
      display: grid;
      grid-template-columns: 116px 1fr 84px 84px 28px;
      gap: 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(232,227,216,0.3);
      margin-bottom: 6px;
    }

    .tally {
      position: sticky;
      bottom: 0;
      background: #131922;
      border: 1px solid rgba(212,168,83,0.25);
      border-radius: 8px;
      padding: 14px 20px;
      margin: 24px 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    .tally-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(212,168,83,0.65);
      margin-bottom: 3px;
    }
    .tally-val { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #E8E3D8; }

    /* ── BUTTONS ── */
    .btn {
      background: #D4A853;
      color: #0D1117;
      border: none;
      border-radius: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      padding: 13px 26px;
      cursor: pointer;
      text-transform: uppercase;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-ghost {
      background: transparent;
      color: rgba(232,227,216,0.55);
      border: 1px solid rgba(232,227,216,0.14);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.04); opacity: 1; color: #E8E3D8; }
    .btn-ghost.copied { color: #5CB88A; border-color: rgba(92,184,138,0.35); }
    .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .error-msg { color: #E07558; font-size: 13px; margin-bottom: 16px; }

    /* ── RESULTS ── */
    .results-title { font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 400; margin-bottom: 4px; }
    .results-sub {
      font-size: 12px;
      color: rgba(232,227,216,0.35);
      margin-bottom: 32px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.05em;
    }
    .verdict-card {
      background: rgba(212,168,83,0.05);
      border: 1px solid rgba(212,168,83,0.2);
      border-radius: 8px;
      padding: 34px;
      text-align: center;
      margin-bottom: 24px;
    }
    .verdict-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(212,168,83,0.7);
      margin-bottom: 12px;
    }
    .verdict-value { font-family: 'Playfair Display', serif; font-size: 40px; line-height: 1.15; margin-bottom: 16px; }
    .verdict-sentence { font-size: 17px; color: #E8E3D8; max-width: 520px; margin: 0 auto 12px; line-height: 1.5; }
    .verdict-note { font-size: 13px; color: rgba(232,227,216,0.5); max-width: 520px; margin: 0 auto; }
    .section-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(212,168,83,0.65);
      margin: 32px 0 14px;
    }
    .answer {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 14px;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(232,227,216,0.07);
      border-radius: 8px;
      padding: 18px 22px;
      margin-bottom: 10px;
    }
    .answer-num { font-family: 'Playfair Display', serif; font-size: 28px; color: #D4A853; opacity: 0.6; line-height: 1; }
    .answer-q {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(212,168,83,0.6);
      margin-bottom: 5px;
    }
    .answer-a { font-size: 16px; color: #E8E3D8; line-height: 1.45; }
    .answer-how { font-size: 12.5px; color: rgba(232,227,216,0.45); margin-top: 5px; }
    .breakdown { list-style: none; margin-top: 4px; }
    .breakdown li {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      font-size: 13px;
      color: rgba(232,227,216,0.6);
      padding: 6px 0;
      border-bottom: 1px solid rgba(232,227,216,0.05);
    }
    .breakdown li:last-child { border-bottom: none; }
    .breakdown .amt { font-family: 'IBM Plex Mono', monospace; color: rgba(232,227,216,0.8); white-space: nowrap; }
    .breakdown .tag { color: rgba(232,227,216,0.35); font-size: 11.5px; }
    .breakdown li.stage-row {
      color: #D4A853;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding-top: 12px;
    }
    .own-prefix { font-family: 'Playfair Display', serif; font-size: 20px; margin-bottom: 10px; }
    .paste-note {
      font-size: 13px;
      color: rgba(232,227,216,0.55);
      margin: 18px 0 0;
      max-width: 600px;
    }

    @media print {
      body { background: #fff; color: #111; }
      .header { border-color: #ddd; }
      .logo-mark, .answer-num, .breakdown li.stage-row { color: #333; }
      .no-print { display: none !important; }
      .verdict-card, .answer, .card { background: #f8f6f0; border-color: #ddd; }
      .eyebrow, .section-label, .verdict-label, .answer-q, .header-sub, .results-sub { color: #555; }
      .verdict-value, .verdict-sentence, .answer-a, .results-title, .own-prefix { color: #111 !important; }
      .verdict-note, .answer-how, .breakdown li, .breakdown .amt, .breakdown .tag, .paste-note, .fine { color: #333; }
      .form-input::placeholder { color: transparent; }
      .form-input { color: #111; border-color: #bbb; background: #fff; }
    }

    @media (max-width: 640px) {
      .header { padding: 16px 20px; }
      .main { padding: 30px 18px 60px; }
      .intro-heading { font-size: 32px; }
      .step-heading { font-size: 25px; }
      .step-name { display: none; }
      .choices, .choices.six { grid-template-columns: 1fr; }
      .col-heads { display: none; }
      .line { grid-template-columns: 1fr 1fr 28px; }
      .line .line-p { grid-column: 1 / 3; }
      .line .line-what { grid-column: 1 / 4; grid-row: 2; }
      .line .line-low { grid-row: 3; }
      .line .line-high { grid-row: 3; }
      .line .x-btn { grid-column: 3; grid-row: 1; }
      .tally { grid-template-columns: 1fr 1fr; }
      .verdict-value { font-size: 32px; }
      .verdict-card { padding: 26px 18px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script>
    // ════════════════════════════════════════════════════════════════
    // ONE UNIT AND WHAT IT COSTS  ·  ELI 102, Fall 2026
    //
    // A worksheet, not an interview: nothing here calls an AI or a server.
    // Everything the student types stays in their browser.
    //
    // The text it produces starts with "ENDURE Unit Economics Analysis".
    // The Venture Assessment looks for that exact header in a journal and
    // skips its own five questions when it finds it. Do not change it.
    // ════════════════════════════════════════════════════════════════

    // ── COURSE REFERENCE FIGURES ──
    // The same figures as COURSE_CONTEXT in venture-assessment.html.
    // Change them here when the college's own budget figures arrive.
    var REF = {
      perStudent: 25500,          // average tuition one undergraduate pays a year after scholarships (2024-25)
      portlandMinWage: "16.80",   // Oregon BOLI, Portland metro rate, 1 July 2026 to 30 June 2027
      counts: [
        ["About 1,970", "undergraduates in 2025-26"],
        ["413", "new students in the Fall 2026 class"],
        ["482", "first-years started in Fall 2024, and 400 of them came back for a second year"],
        ["421", "varsity athletes, about one undergraduate in five"]
      ]
    };

    var STEPS = [
      { key: "unit", name: "The unit" },
      { key: "count", name: "How many" },
      { key: "fork", name: "Each time?" },
      { key: "costs", name: "The costs" },
      { key: "number", name: "The number" },
      { key: "results", name: "The answer" }
    ];

    // The 5 Es (Doblin). Stage questions match the Wednesday 11 November slides.
    var STAGES = [
      { key: "entice", name: "Entice", q: "How do people first hear of it? What is the invitation?", eg: "Posters, tabling, emails, someone's time to spread the word." },
      { key: "enter", name: "Enter", q: "What is the threshold moment when they are in?", eg: "Sign-up, matching, training, a first session." },
      { key: "engage", name: "Engage", q: "What is the core experience? What are they doing?", eg: "People's time, a room, food, software, supplies." },
      { key: "exit", name: "Exit", q: "How does it end, and does it end well?", eg: "A last session, a hand-over, asking how it went." },
      { key: "extend", name: "Extend", q: "What brings them back, or makes them tell a friend?", eg: "Reminders, follow-up, keeping the information current." }
    ];

    // The Ps that cost money (Stillman's 6 Ps, minus Plusses & Deltas, plus a catch-all).
    var PS = [
      { key: "people", name: "People", ph: "Who, and how many hours" },
      { key: "props", name: "Props", ph: "Which objects, software or supplies" },
      { key: "processes", name: "Processes", ph: "What has to happen behind the scenes" },
      { key: "place", name: "Place", ph: "Which space, and how often" },
      { key: "partners", name: "Partners", ph: "Which organisation, and what they charge" },
      { key: "other", name: "Other", ph: "What it is" }
    ];

    // The six college numbers, named as on the Monday 16 November slides and handout.
    var NUMBERS = [
      { key: "enrolled", name: "New students enrolled", body: "More students choose Lewis & Clark.", kind: "students", verb: ["enrols", "enrol"] },
      { key: "stay", name: "Students who stay", body: "Fewer students leave before they finish.", kind: "students", verb: ["stays", "stay"] },
      { key: "graduate", name: "Students who graduate", body: "More students finish their degree.", kind: "students", verb: ["graduates", "graduate"] },
      { key: "jobs", name: "Jobs after graduation", body: "More graduates in work or further study.", kind: "dollars" },
      { key: "gifts", name: "Gifts to the college", body: "More alumni and donors give.", kind: "dollars" },
      { key: "saved", name: "Costs saved", body: "The college spends less to do the same thing.", kind: "dollars" }
    ];

    var HOWLONG = {
      year: "for one year",
      semester: "for one semester",
      once: "one time"
    };

    var BLANK = {
      step: "intro",
      name: "", desc: "",
      who: "", what: "", howLong: "year", howLongOther: "",
      unitsLow: "", unitsHigh: "", unitsBasis: "",
      fork: "",
      lines: [], nextId: 1,
      number: "",
      studentsLow: "", studentsHigh: "", perStudent: String(REF.perStudent),
      dollarsLow: "", dollarsHigh: "",
      reasoning: "",
      ownSentence: ""
    };

    // ── SAVED PROGRESS (this browser only, kept 14 days) ──
    var UE_KEY = "ue-state-fall2026";
    var UE_TTL = 14 * 24 * 60 * 60 * 1000;
    function ueClear() { try { localStorage.removeItem(UE_KEY); localStorage.removeItem(UE_KEY + "-at"); } catch (err) { /* storage unavailable */ } }
    function ueSave(state) { try { localStorage.setItem(UE_KEY, JSON.stringify(state)); localStorage.setItem(UE_KEY + "-at", String(Date.now())); } catch (err) { /* storage full or unavailable */ } }
    function ueLoad() {
      try {
        var at = Number(localStorage.getItem(UE_KEY + "-at") || 0);
        if (!at || Date.now() - at > UE_TTL) { ueClear(); return null; }
        var parsed = JSON.parse(localStorage.getItem(UE_KEY));
        if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.lines)) return null;
        var merged = {};
        Object.keys(BLANK).forEach(function(k) { merged[k] = parsed[k] !== undefined ? parsed[k] : BLANK[k]; });
        return merged;
      } catch (err) { return null; }
    }

    // ── NUMBERS ──
    function isBlank(v) { return v === null || v === undefined || String(v).trim() === ""; }
    function num(v) {
      if (isBlank(v)) return 0;
      var s = String(v).replace(/[$,\s]/g, "");
      var k = /^(\d*\.?\d+)k$/i.exec(s);
      var n = k ? parseFloat(k[1]) * 1000 : parseFloat(s);
      return isFinite(n) && n > 0 ? n : 0;
    }
    // A low guess and a high guess. One blank copies the other; reversed guesses are swapped.
    function pair(lo, hi) {
      if (isBlank(lo) && isBlank(hi)) return { low: 0, high: 0, empty: true };
      var a = isBlank(lo) ? num(hi) : num(lo);
      var b = isBlank(hi) ? num(lo) : num(hi);
      return { low: Math.min(a, b), high: Math.max(a, b), empty: false };
    }
    function money(n) {
      n = Number(n) || 0;
      if (n > 0 && n < 100 && Math.round(n * 100) % 100 !== 0) return "$" + n.toFixed(2);
      return "$" + Math.round(n).toLocaleString("en-US");
    }
    function moneyRange(lo, hi) { var a = money(lo), b = money(hi); return a === b ? a : a + " – " + b; }
    function count(n) { return (Math.round(Number(n) * 10) / 10).toLocaleString("en-US"); }
    function countRange(lo, hi) { var a = count(lo), b = count(hi); return a === b ? a : a + " – " + b; }
    // The same ranges written for a sentence: "1 to 2", "$9,000 to $30,000".
    function countTo(lo, hi) { var a = count(lo), b = count(hi); return a === b ? a : a + " to " + b; }
    function moneyTo(lo, hi) { var a = money(lo), b = money(hi); return a === b ? a : a + " to " + b; }

    // ── THE UNIT SENTENCE ──
    function tidy(s) { return String(s || "").trim().replace(/\s+/g, " ").replace(/[.]+$/, ""); }
    function unitParts(S) {
      var who = tidy(S.who).replace(/^(one|a|an)\s+/i, "");
      var what = tidy(S.what).replace(/^(who|that)\s+/i, "");
      var howLong = S.howLong === "other" ? tidy(S.howLongOther) : HOWLONG[S.howLong];
      return { who: who, what: what, howLong: howLong };
    }
    function unitSentence(S) {
      var p = unitParts(S);
      if (!p.who && !p.what) return "";
      return "One " + (p.who || "…") + " who " + (p.what || "…") + (p.howLong ? ", " + p.howLong : "") + ".";
    }
    // The commonest mistake: naming the idea instead of a person using it.
    function whoLooksLikeTheIdea(who) {
      return /\b(app|apps|platform|website|site|program|programme|service|event|events|download|downloads|tool|system|club|fund)\b/i.test(who || "");
    }

    function numberInfo(key) {
      for (var i = 0; i < NUMBERS.length; i++) { if (NUMBERS[i].key === key) return NUMBERS[i]; }
      return null;
    }

    // ── THE ARITHMETIC ──
    // each   = costs that repeat for every unit
    // shared = costs for the whole year, however many units there are
    function compute(S) {
      var units = pair(S.unitsLow, S.unitsHigh);
      var each = { low: 0, high: 0 }, shared = { low: 0, high: 0 };
      var stages = STAGES.map(function(st) { return { key: st.key, name: st.name, lines: [] }; });
      var lineCount = 0;
      (S.lines || []).forEach(function(l) {
        var p = pair(l.low, l.high);
        if (p.empty && isBlank(l.what)) return;
        var tgt = l.basis === "shared" ? shared : each;
        tgt.low += p.low; tgt.high += p.high;
        lineCount++;
        stages.forEach(function(st) {
          if (st.key === l.stage) st.lines.push({ p: l.p, what: tidy(l.what), low: p.low, high: p.high, basis: l.basis === "shared" ? "shared" : "each" });
        });
      });

      // More units spread a shared cost thinner, so the low cost of one unit uses the high count.
      var unitCost = {
        low: each.low + (units.high > 0 ? shared.low / units.high : 0),
        high: each.high + (units.low > 0 ? shared.high / units.low : 0)
      };
      var out = {
        low: each.low * units.low + shared.low,
        high: each.high * units.high + shared.high
      };

      var info = numberInfo(S.number);
      var kind = info ? info.kind : "";
      var students = pair(S.studentsLow, S.studentsHigh);
      var per = num(S.perStudent);
      var inn = { low: 0, high: 0 };
      if (kind === "students") inn = { low: students.low * per, high: students.high * per };
      if (kind === "dollars") { var d = pair(S.dollarsLow, S.dollarsHigh); inn = { low: d.low, high: d.high }; }

      // Same three verdicts as the Venture Assessment.
      var verdict = "Not yet";
      if (inn.high > 0 && inn.low > out.high) verdict = "Yes";
      else if (inn.high > 0 && inn.high > out.low) verdict = "Only at the high end";

      // How many more students a year would cover the cost.
      var breakEven = null;
      if (kind === "students" && per > 0) {
        breakEven = { low: Math.max(1, Math.ceil(out.low / per)), high: Math.max(1, Math.ceil(out.high / per)) };
      }

      return {
        units: units, each: each, shared: shared, unitCost: unitCost, out: out,
        stages: stages, lineCount: lineCount,
        info: info, kind: kind, students: students, per: per, inn: inn,
        verdict: verdict, breakEven: breakEven
      };
    }

    function paysSentence(S, C) {
      if (C.kind === "students" && C.breakEven) {
        var b = C.breakEven;
        var one = b.low === 1 && b.high === 1;
        return "This pays for itself if " + countTo(b.low, b.high) + " more " + (one ? "student" : "students") +
          " a year " + C.info.verb[one ? 0 : 1] + " because of it.";
      }
      var amount = moneyTo(C.out.low, C.out.high);
      if (S.number === "saved") return "This pays for itself if it saves the college at least " + amount + " a year.";
      if (S.number === "gifts") return "This pays for itself if it brings in at least " + amount + " a year in gifts.";
      return "This pays for itself if it is worth at least " + amount + " a year to the college.";
    }

    function verdictNote(S, C) {
      if (C.kind === "students") {
        var mine = "Your own guess is " + countTo(C.students.low, C.students.high) + " more " +
          (C.students.low === 1 && C.students.high === 1 ? "student" : "students") + " a year.";
        return mine + " That is an estimate, not evidence yet.";
      }
      if (C.inn.high <= 0) return "There is no dollar figure for the money it brings in yet. Say what the college would have to believe to pay for it.";
      return "Your own guess is " + moneyTo(C.inn.low, C.inn.high) + " a year. That is an estimate, not evidence yet.";
    }

    function ownWords(S) {
      var t = tidy(S.ownSentence).replace(/^this pays for itself if\s*/i, "");
      return t ? "This pays for itself if " + t + "." : "";
    }

    function forkLabel(S) {
      if (S.fork === "each") return "Yes. Each extra student adds cost.";
      if (S.fork === "shared") return "No. The cost is about the same however many students use it.";
      return "";
    }

    function today() { return new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }); }

    // ── THE TEXT STUDENTS PASTE INTO THEIR JOURNAL ──
    function buildPlainText(S) {
      var C = compute(S);
      var rule = "───────────────────────────────────────";
      var heavy = "═══════════════════════════════════════";
      var lines = [];
      lines.push("ENDURE Unit Economics Analysis — " + tidy(S.name).toUpperCase());
      lines.push("Generated " + today() + " with One Unit and What It Costs");
      if (tidy(S.desc)) lines.push("The idea: " + tidy(S.desc) + ".");
      lines.push("");
      lines.push(heavy);
      lines.push("DOES IT PAY FOR ITSELF? — " + C.verdict);
      lines.push(paysSentence(S, C));
      if (ownWords(S)) lines.push("In my words: " + ownWords(S));
      lines.push(verdictNote(S, C));
      lines.push("");
      lines.push(rule);
      lines.push("ONE UNIT: " + unitSentence(S));
      lines.push("UNITS A YEAR AT LEWIS & CLARK: " + countRange(C.units.low, C.units.high));
      if (tidy(S.unitsBasis)) lines.push("  — " + tidy(S.unitsBasis));
      lines.push("DOES IT COST MORE EACH TIME ANOTHER STUDENT USES IT? " + forkLabel(S));
      lines.push("");
      lines.push("COST OF ONE UNIT: " + moneyRange(C.unitCost.low, C.unitCost.high));
      C.stages.forEach(function(st) {
        if (!st.lines.length) return;
        lines.push("  " + st.name);
        st.lines.forEach(function(l) {
          var pName = "";
          PS.forEach(function(p) { if (p.key === l.p) pName = p.name; });
          lines.push("  — " + pName + (l.what ? ": " + l.what : "") + ": " + moneyRange(l.low, l.high) +
            (l.basis === "shared" ? " (for the whole year)" : " (for each unit)"));
        });
      });
      if (C.each.high > 0) lines.push("  Costs for each unit: " + moneyRange(C.each.low, C.each.high));
      if (C.shared.high > 0) lines.push("  Costs for the whole year: " + moneyRange(C.shared.low, C.shared.high) + ", shared between " + countRange(C.units.low, C.units.high) + " units");
      lines.push("MONEY OUT PER YEAR: " + moneyRange(C.out.low, C.out.high));
      lines.push("  Running costs only. The cost of building it is not counted here.");
      lines.push("");
      lines.push(rule);
      lines.push("THE COLLEGE NUMBER IT CHANGES: " + (C.info ? C.info.name : ""));
      if (C.kind === "students") lines.push("  " + countRange(C.students.low, C.students.high) + " more students a year");
      if (tidy(S.reasoning)) lines.push("  — " + tidy(S.reasoning));
      lines.push("MONEY IN PER YEAR: " + (C.inn.high > 0 ? moneyRange(C.inn.low, C.inn.high) : "No dollar figure yet"));
      if (C.kind === "students") lines.push("  — " + countRange(C.students.low, C.students.high) + " students × " + money(C.per) + " that one student pays the college in a year");
      lines.push("");
      lines.push(heavy);
      return lines.join("\n");
    }

    // ════════════════════════════════════════════════════════════════
    // SCREENS
    // ════════════════════════════════════════════════════════════════
    var e = React.createElement;
    var useState = React.useState, useEffect = React.useEffect;

    function App() {
      var s0 = useState(BLANK); var S = s0[0], setS = s0[1];
      var s1 = useState(function() { var saved = ueLoad(); return saved && saved.step !== "intro" ? saved : null; });
      var saved = s1[0], setSaved = s1[1];
      var s2 = useState(""); var error = s2[0], setError = s2[1];
      var s3 = useState(false); var copied = s3[0], setCopied = s3[1];

      useEffect(function() { if (S !== BLANK) ueSave(S); }, [S]);

      function update(partial) {
        setS(function(prev) { var next = {}; Object.keys(prev).forEach(function(k) { next[k] = prev[k]; }); Object.keys(partial).forEach(function(k) { next[k] = partial[k]; }); return next; });
      }
      function go(step) { setError(""); update({ step: step }); window.scrollTo(0, 0); }
      function fail(msg) { setError(msg); }
      function startFresh() { ueClear(); setSaved(null); setError(""); setCopied(false); setS(BLANK); window.scrollTo(0, 0); }

      function addLine(stage, p) {
        var line = { id: S.nextId, stage: stage, p: p, what: "", low: "", high: "", basis: S.fork === "shared" ? "shared" : "each" };
        update({ lines: S.lines.concat([line]), nextId: S.nextId + 1 });
      }
      function updateLine(id, partial) {
        update({ lines: S.lines.map(function(l) {
          if (l.id !== id) return l;
          var next = {}; Object.keys(l).forEach(function(k) { next[k] = l[k]; }); Object.keys(partial).forEach(function(k) { next[k] = partial[k]; });
          return next;
        }) });
      }
      function removeLine(id) { update({ lines: S.lines.filter(function(l) { return l.id !== id; }) }); }

      // Choosing a different fork re-labels cost lines the student has not priced yet.
      function chooseFork(fork) {
        update({ fork: fork, lines: S.lines.map(function(l) {
          if (!isBlank(l.low) || !isBlank(l.high)) return l;
          var next = {}; Object.keys(l).forEach(function(k) { next[k] = l[k]; }); next.basis = fork === "shared" ? "shared" : "each";
          return next;
        }) });
      }

      function copyText() {
        var text = buildPlainText(S);
        function done() { setCopied(true); setTimeout(function() { setCopied(false); }, 2500); }
        function fallback() {
          var ta = document.createElement("textarea");
          ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); done(); } catch (err) { /* nothing more to try */ }
          document.body.removeChild(ta);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
        else fallback();
      }

      // ── shared pieces ──
      function header() {
        return e("header", { className: "header" },
          e("a", { href: "index.html", className: "logo-mark", style: { textDecoration: "none" }, title: "Back to all tools" }, "ENDURE"),
          e("span", { className: "header-sub" }, "One Unit and What It Costs")
        );
      }
      function stepBar() {
        var idx = -1;
        STEPS.forEach(function(st, i) { if (st.key === S.step) idx = i; });
        return e("div", { className: "steps no-print" },
          STEPS.map(function(st, i) {
            return e("div", { key: st.key, className: "step-seg" + (i === idx ? " active" : i < idx ? " done" : "") },
              e("div", { className: "step-line" }),
              e("div", { className: "step-name" }, (i + 1) + " · " + st.name)
            );
          })
        );
      }
      function text(key, placeholder, extra) {
        var props = { className: "form-input", value: S[key], placeholder: placeholder || "", onChange: function(ev) { var p = {}; p[key] = ev.target.value; update(p); } };
        if (extra) Object.keys(extra).forEach(function(k) { props[k] = extra[k]; });
        return e(props.rows ? "textarea" : "input", props);
      }
      function numberInput(key, placeholder) { return text(key, placeholder, { inputMode: "decimal" }); }
      function group(label, hint, control, after) {
        return e("div", { className: "form-group" },
          e("label", { className: "form-label" }, label),
          hint ? e("div", { className: "form-hint" }, hint) : null,
          control,
          after || null
        );
      }
      function nav(backStep, nextLabel, onNext) {
        return e("div", null,
          error ? e("div", { className: "error-msg" }, error) : null,
          e("div", { className: "actions no-print" },
            e("button", { className: "btn", onClick: onNext }, nextLabel),
            backStep ? e("button", { className: "btn btn-ghost", onClick: function() { go(backStep); } }, "← Back") : null
          )
        );
      }
      function page() {
        var kids = Array.prototype.slice.call(arguments);
        return e("div", null, header(), e("main", { className: "main" }, S.step === "intro" ? null : stepBar(), kids));
      }
      function unitCard() {
        var sentence = unitSentence(S);
        return e("div", { key: "unitcard" },
          e("div", { className: "sentence-label" }, "Your unit"),
          e("div", { className: "sentence" + (sentence ? "" : " empty") }, sentence || "One … who …, for one year.")
        );
      }

      // ── INTRO ──
      if (S.step === "intro") {
        return page(
          e("div", { key: "a", className: "eyebrow" }, "ELI 102 · Viability"),
          e("h1", { key: "b", className: "intro-heading" }, "One unit, and ", e("em", null, "what it costs.")),
          e("p", { key: "c", className: "intro-body" },
            "This walks you from your journey map to the five viability answers and your “This pays for itself if” sentence. " +
            "It takes 10 to 15 minutes. Have your journey map open: the 5 Es, and the Ps under each stage."),
          e("p", { key: "d", className: "intro-body", style: { marginBottom: 32 } },
            "Guesses are expected. Give each number as a low guess and a high guess. Nothing you type is sent anywhere; it stays in this browser."),
          saved ? e("div", { key: "resume", className: "card" },
            e("div", { className: "form-label" }, "You have saved answers" + (tidy(saved.name) ? " for " + tidy(saved.name) : "")),
            e("div", { className: "form-hint", style: { marginBottom: 16 } }, "They are kept on this computer for 14 days."),
            e("div", { className: "actions" },
              e("button", { className: "btn", onClick: function() { setError(""); setS(saved); setSaved(null); window.scrollTo(0, 0); } }, "Carry on →"),
              e("button", { className: "btn btn-ghost", onClick: startFresh }, "Start fresh")
            )
          ) : null,
          saved ? null : e("div", { key: "e", className: "card" },
            group("The name of your idea", null, text("name", "What you call it")),
            group("Your idea in one sentence", "Who it is for and what it does.", text("desc", "It helps … by …", { rows: 2 }))
          ),
          saved ? null : e("div", { key: "f" }, nav(null, "Begin →", function() {
            if (!tidy(S.name)) return fail("Give your idea a name first.");
            go("unit");
          }))
        );
      }

      // ── 1 · THE UNIT ──
      if (S.step === "unit") {
        var whoWarn = whoLooksLikeTheIdea(S.who);
        return page(
          e("div", { key: "a", className: "eyebrow" }, "Question 1 of 5"),
          e("div", { key: "b", className: "step-heading" }, "What is one unit?"),
          e("div", { key: "c", className: "step-body" },
            "A unit is one use of your idea by one person. It is the thing you would count. Build it from three parts: one person, what they get, and for how long."),
          unitCard(),
          e("div", { key: "d", className: "card" },
            group("One …", "The person. Be specific: not “students”, one of them.",
              text("who", "first-year student"),
              whoWarn ? e("div", { className: "nudge" }, "That sounds like your idea, not a person. The unit is someone using it. Who is that person?") : null),
            group("Who …", "What they get or do.", text("what", "meets a peer mentor every two weeks")),
            group("For how long", "If it is hard to choose, use one year.",
              e("select", { className: "form-input", value: S.howLong, onChange: function(ev) { update({ howLong: ev.target.value }); } },
                e("option", { value: "year" }, "For one year"),
                e("option", { value: "semester" }, "For one semester"),
                e("option", { value: "once" }, "One time (an event, a session, a visit)"),
                e("option", { value: "other" }, "Something else")
              ),
              S.howLong === "other" ? e("div", { style: { marginTop: 10 } }, text("howLongOther", "for four weeks")) : null)
          ),
          e("div", { key: "e", className: "card quiet" },
            e("div", { className: "form-label" }, "Three kinds of idea, three units"),
            e("ul", { className: "examples" },
              e("li", null, e("b", null, "A mentoring idea: "), "One first-year student who meets a peer mentor every two weeks, for one year."),
              e("li", null, e("b", null, "An events idea: "), "One student who comes to a welcome dinner, one time."),
              e("li", null, e("b", null, "An app: "), "One student who opens it at least once a week, for one year. The unit is not the app, and it is not a download.")
            )
          ),
          e("div", { key: "f" }, nav("intro", "Next →", function() {
            var p = unitParts(S);
            if (!p.who || !p.what) return fail("Fill in the person and what they get.");
            if (S.howLong === "other" && !p.howLong) return fail("Say for how long.");
            go("count");
          }))
        );
      }

      // ── 2 · HOW MANY ──
      if (S.step === "count") {
        var countHint = "How many of these would there really be in a year?";
        if (S.howLong === "once") countHint = "Count every time. Five dinners with 40 students each is 200 units.";
        if (S.howLong === "semester") countHint = "A student who uses it in both semesters counts twice.";
        return page(
          e("div", { key: "a", className: "eyebrow" }, "Question 2 of 5"),
          e("div", { key: "b", className: "step-heading" }, "How many units in one year at Lewis & Clark?"),
          e("div", { key: "c", className: "step-body" },
            "Start from a real count, then say what share you would reach. Count the people who would really use it, not everyone who could."),
          unitCard(),
          e("div", { key: "d", className: "card" },
            group("Units in one year", countHint,
              e("div", { className: "pair" }, numberInput("unitsLow", "Low guess"), numberInput("unitsHigh", "High guess"))),
            group("Where does that count come from?", "One sentence. For example: about one in six of the 413 new students.",
              text("unitsBasis", "", { rows: 2 }))
          ),
          e("div", { key: "e", className: "card quiet" },
            e("div", { className: "form-label" }, "Real counts to start from"),
            e("table", { className: "ref-table" }, e("tbody", null,
              REF.counts.map(function(r, i) { return e("tr", { key: i }, e("td", null, r[0]), e("td", null, r[1])); })
            )),
            e("div", { className: "fine" }, "Course reference figures, not this year's audited numbers.")
          ),
          e("div", { key: "f" }, nav("unit", "Next →", function() {
            var u = pair(S.unitsLow, S.unitsHigh);
            if (u.empty || u.low <= 0) return fail("Give a low guess and a high guess, both above zero.");
            go("fork");
          }))
        );
      }

      // ── 3 · THE FORK ──
      if (S.step === "fork") {
        return page(
          e("div", { key: "a", className: "eyebrow" }, "Before question 3"),
          e("div", { key: "b", className: "step-heading" }, "Does it cost more each time another student uses it?"),
          e("div", { key: "c", className: "step-body" }, "This decides how you work out the cost of one unit."),
          e("div", { key: "d", className: "choices" },
            e("button", { className: "choice" + (S.fork === "each" ? " on" : ""), onClick: function() { chooseFork("each"); } },
              e("div", { className: "choice-title" }, "Yes. Each student adds cost."),
              e("div", { className: "choice-body" }, "Every extra student needs more of something: an hour of a mentor's time, a seat at an event, a meal, money from a fund. Twice the students costs about twice as much."),
              e("div", { className: "choice-then" }, "→ Add up what one student costs.")
            ),
            e("button", { className: "choice" + (S.fork === "shared" ? " on" : ""), onClick: function() { chooseFork("shared"); } },
              e("div", { className: "choice-title" }, "No. The cost is about the same."),
              e("div", { className: "choice-body" }, "It costs about the same whether 50 students use it or 1,500: an app, a website, a guide, a shared calendar. The cost follows what you keep running, not who shows up."),
              e("div", { className: "choice-then" }, "→ Add up a year's running cost, then divide by the students who use it.")
            )
          ),
          e("div", { key: "e", className: "step-body" }, "Many ideas have some of both. Pick the one that fits most of your costs. On the next screen you can mark each cost either way."),
          e("div", { key: "f" }, nav("count", "Next →", function() {
            if (!S.fork) return fail("Pick one of the two.");
            go("costs");
          }))
        );
      }

      // ── 4 · THE COSTS ──
      if (S.step === "costs") {
        var Cc = compute(S);
        return page(
          e("div", { key: "a", className: "eyebrow" }, "Question 3 of 5"),
          e("div", { key: "b", className: "step-heading" }, "What does one unit cost to run?"),
          e("div", { key: "c", className: "step-body" },
            "Walk your journey map. At each stage, look at the Ps you wrote under it and ask: which of these costs money or someone's time? Add a line for each one. " +
            "Count running costs only, not what it costs to build."),
          e("div", { key: "c2", className: "card quiet", style: { padding: "18px 22px" } },
            e("ul", { className: "examples" },
              e("li", null, e("b", null, "Each unit or whole year? "),
                "Mark a cost “each unit” if it repeats for every unit, and “whole year” if it is about the same however many there are."),
              e("li", null, e("b", null, "People's time: "), "hours × pay per hour. Minimum wage in Portland is $" + REF.portlandMinWage + " an hour. For staff, divide the yearly salary by 2,000."),
              e("li", null, e("b", null, "Free help: "), "if someone gives their time for free, add the line and write 0. Your idea still depends on them."),
              e("li", null, e("b", null, "Plusses & Deltas "), "is the one P that is not a cost. A delta, something broken, usually needs a cost line to fix it.")
            )
          ),
          unitCard(),
          STAGES.map(function(st, si) {
            var mine = S.lines.filter(function(l) { return l.stage === st.key; });
            var tot = { low: 0, high: 0 };
            mine.forEach(function(l) { var p = pair(l.low, l.high); tot.low += p.low; tot.high += p.high; });
            return e("div", { key: st.key, className: "stage" },
              e("div", { className: "stage-head" },
                e("span", { className: "stage-num" }, "STAGE " + (si + 1)),
                e("span", { className: "stage-name" }, st.name),
                tot.high > 0 ? e("span", { className: "stage-total" }, moneyRange(tot.low, tot.high)) : null
              ),
              e("div", { className: "stage-q" }, st.q),
              e("div", { className: "stage-eg" }, st.eg),
              mine.length ? e("div", { className: "col-heads" },
                e("span", null, "Which P"), e("span", null, "What it is"), e("span", null, "Low $"), e("span", null, "High $"), e("span", null, "")
              ) : null,
              mine.map(function(l) {
                var ph = "";
                PS.forEach(function(p) { if (p.key === l.p) ph = p.ph; });
                return e("div", { key: l.id, className: "line-wrap" },
                  e("div", { className: "line" },
                    e("select", { className: "form-input line-p", value: l.p, "aria-label": "Which P", onChange: function(ev) { updateLine(l.id, { p: ev.target.value }); } },
                      PS.map(function(p) { return e("option", { key: p.key, value: p.key }, p.name); })),
                    e("input", { className: "form-input line-what", value: l.what, placeholder: ph, "aria-label": "What it is", onChange: function(ev) { updateLine(l.id, { what: ev.target.value }); } }),
                    e("input", { className: "form-input line-low", value: l.low, placeholder: "Low", inputMode: "decimal", "aria-label": "Low guess in dollars", onChange: function(ev) { updateLine(l.id, { low: ev.target.value }); } }),
                    e("input", { className: "form-input line-high", value: l.high, placeholder: "High", inputMode: "decimal", "aria-label": "High guess in dollars", onChange: function(ev) { updateLine(l.id, { high: ev.target.value }); } }),
                    e("button", { className: "x-btn", title: "Remove this line", "aria-label": "Remove this line", onClick: function() { removeLine(l.id); } }, "×")
                  ),
                  e("div", { className: "line-foot" },
                    e("span", { className: "line-foot-label" }, "This cost is for"),
                    e("span", { className: "seg" },
                      e("button", { className: l.basis === "each" ? "on" : "", onClick: function() { updateLine(l.id, { basis: "each" }); } }, "each unit"),
                      e("button", { className: l.basis === "shared" ? "on" : "", onClick: function() { updateLine(l.id, { basis: "shared" }); } }, "the whole year")
                    )
                  )
                );
              }),
              e("div", { className: "chips no-print" },
                PS.map(function(p) {
                  return e("button", { key: p.key, className: "chip", onClick: function() { addLine(st.key, p.key); } }, "+ " + p.name);
                })
              )
            );
          }),
          e("div", { key: "tally", className: "tally" },
            e("div", null, e("div", { className: "tally-label" }, "For each unit"), e("div", { className: "tally-val" }, moneyRange(Cc.each.low, Cc.each.high))),
            e("div", null, e("div", { className: "tally-label" }, "For the whole year"), e("div", { className: "tally-val" }, moneyRange(Cc.shared.low, Cc.shared.high))),
            e("div", null, e("div", { className: "tally-label" }, "Cost of one unit"), e("div", { className: "tally-val" }, moneyRange(Cc.unitCost.low, Cc.unitCost.high))),
            e("div", null, e("div", { className: "tally-label" }, "Money out a year"), e("div", { className: "tally-val" }, moneyRange(Cc.out.low, Cc.out.high)))
          ),
          e("div", { key: "f" }, nav("fork", "Next →", function() {
            var C = compute(S);
            if (C.lineCount === 0) return fail("Add at least one cost line. Click a P under any stage.");
            if (C.out.high <= 0) return fail("Put a dollar guess on at least one line.");
            go("number");
          }))
        );
      }

      // ── 5 · THE NUMBER ──
      if (S.step === "number") {
        var info = numberInfo(S.number);
        var Cn = compute(S);
        var followUp = null;
        if (info && info.kind === "students") {
          followUp = e("div", { key: "fu", className: "card" },
            group("How many more students a year " + info.verb[1] + " because of it?", "Students who otherwise would not. Be sceptical: this is the hardest number to defend.",
              e("div", { className: "pair" }, numberInput("studentsLow", "Low guess"), numberInput("studentsHigh", "High guess"))),
            group("What makes you think so?", "One or two sentences.", text("reasoning", "", { rows: 2 })),
            group("What one student pays the college in a year",
              "$" + REF.perStudent.toLocaleString("en-US") + " is the average tuition one undergraduate pays in a year, after scholarships. Change it if your students pay less, for example students on full-tuition scholarships.",
              numberInput("perStudent", String(REF.perStudent)))
          );
        } else if (info) {
          var q = "Is there a dollar figure for the college?";
          var hint = "If there is, give a low guess and a high guess for one year. If there is not, leave these empty.";
          if (info.key === "gifts") { q = "How much more would be given in a year?"; hint = "A low guess and a high guess, in dollars."; }
          if (info.key === "saved") { q = "How much would the college save in a year?"; hint = "Staff hours no longer needed × pay per hour, or things the college could stop paying for."; }
          followUp = e("div", { key: "fu", className: "card" },
            group(q, hint, e("div", { className: "pair" }, numberInput("dollarsLow", "Low guess $"), numberInput("dollarsHigh", "High guess $"))),
            group(info.key === "jobs" ? "What would the college have to believe to pay for this?" : "Where does that figure come from?", "One or two sentences.", text("reasoning", "", { rows: 2 }))
          );
        }
        return page(
          e("div", { key: "a", className: "eyebrow" }, "Questions 4 and 5 of 5"),
          e("div", { key: "b", className: "step-heading" }, "Which college number does it change, and what is that worth?"),
          e("div", { key: "c", className: "step-body" },
            "So far it costs " + moneyTo(Cn.out.low, Cn.out.high) + " a year to run. Pick the one number your idea changes most."),
          e("div", { key: "d", className: "choices six" },
            NUMBERS.map(function(n) {
              return e("button", { key: n.key, className: "choice" + (S.number === n.key ? " on" : ""), onClick: function() { update({ number: n.key }); } },
                e("div", { className: "choice-title" }, n.name),
                e("div", { className: "choice-body" }, n.body)
              );
            })
          ),
          followUp,
          e("div", { key: "f" }, nav("costs", "Show the answer →", function() {
            if (!info) return fail("Pick one of the six numbers.");
            if (info.kind === "students") {
              if (pair(S.studentsLow, S.studentsHigh).empty) return fail("Give a low guess and a high guess. Zero is allowed.");
              if (num(S.perStudent) <= 0) return fail("Say what one student pays the college in a year.");
            } else if (pair(S.dollarsLow, S.dollarsHigh).empty && !tidy(S.reasoning)) {
              return fail(info.key === "jobs" ? "Give a dollar figure, or say what the college would have to believe." : "Give a low guess and a high guess.");
            }
            go("results");
          }))
        );
      }

      // ── 6 · THE ANSWER ──
      var C = compute(S);
      var verdictColor = C.verdict === "Yes" ? "#5CB88A" : C.verdict === "Only at the high end" ? "#D4A853" : "#E07558";
      var sharedSpread = C.shared.high > 0 && C.units.low !== C.units.high;
      function answer(n, q, a, how) {
        return e("div", { key: "ans" + n, className: "answer" },
          e("div", { className: "answer-num" }, n),
          e("div", null,
            e("div", { className: "answer-q" }, q),
            e("div", { className: "answer-a" }, a),
            how ? e("div", { className: "answer-how" }, how) : null
          )
        );
      }
      var costHow;
      var unitsTo = countTo(C.units.low, C.units.high), outTo = moneyTo(C.out.low, C.out.high);
      if (C.shared.high > 0 && C.each.high > 0) {
        costHow = moneyTo(C.each.low, C.each.high) + " for each unit, plus " + moneyTo(C.shared.low, C.shared.high) + " for the whole year shared between " + unitsTo + " units. Money out a year: " + outTo + ".";
      } else if (C.shared.high > 0) {
        costHow = moneyTo(C.shared.low, C.shared.high) + " for the whole year, shared between " + unitsTo + " units. Money out a year: " + outTo + ".";
      } else {
        costHow = "Money out a year: " + unitsTo + " units × " + moneyTo(C.each.low, C.each.high) + " = " + outTo + ".";
      }
      var numberAnswer = C.info ? C.info.name : "";
      if (C.kind === "students") numberAnswer += ": " + countRange(C.students.low, C.students.high) + " more a year";
      var worthAnswer = C.inn.high > 0 ? moneyRange(C.inn.low, C.inn.high) + " a year" : "No dollar figure yet";
      var worthHow = C.kind === "students"
        ? countTo(C.students.low, C.students.high) + " students × " + money(C.per) + " that one student pays the college in a year."
        : tidy(S.reasoning);

      return page(
        e("div", { key: "a", className: "eyebrow" }, tidy(S.name)),
        e("div", { key: "b", className: "results-title" }, "One Unit and What It Costs"),
        e("div", { key: "c", className: "results-sub" }, today()),

        e("div", { key: "v", className: "verdict-card" },
          e("div", { className: "verdict-label" }, "Does it pay for itself?"),
          e("div", { className: "verdict-value", style: { color: verdictColor } }, C.verdict),
          e("div", { className: "verdict-sentence" }, paysSentence(S, C)),
          e("div", { className: "verdict-note" }, verdictNote(S, C)),
          C.verdict === "Not yet" ? e("div", { className: "verdict-note", style: { marginTop: 8 } }, "If the numbers do not add up, that is a finding, not a failure. Say what would have to change.") : null
        ),

        e("div", { key: "sl1", className: "section-label" }, "Your five answers"),
        answer(1, "One unit", unitSentence(S), forkLabel(S)),
        answer(2, "Units a year at Lewis & Clark", countRange(C.units.low, C.units.high), tidy(S.unitsBasis)),
        answer(3, "The cost of one unit", moneyRange(C.unitCost.low, C.unitCost.high), costHow),
        answer(4, "The college number it changes", numberAnswer, C.kind === "students" ? tidy(S.reasoning) : ""),
        answer(5, "What that is worth to the college", worthAnswer, worthHow),

        sharedSpread ? e("div", { key: "spread" },
          e("div", { className: "section-label" }, "How many use it changes the cost of one"),
          e("div", { className: "card" },
            e("ul", { className: "breakdown" },
              e("li", null, e("span", null, "If " + count(C.units.low) + " use it, the shared costs come to"), e("span", { className: "amt" }, moneyRange(C.shared.low / C.units.low, C.shared.high / C.units.low) + " each")),
              e("li", null, e("span", null, "If " + count(C.units.high) + " use it, the shared costs come to"), e("span", { className: "amt" }, moneyRange(C.shared.low / C.units.high, C.shared.high / C.units.high) + " each"))
            ),
            e("div", { className: "fine" }, "When the cost is shared, your count of users decides most of the answer. It is the number to check first.")
          )
        ) : null,

        e("div", { key: "sl2", className: "section-label" }, "Where the money goes on your journey map"),
        e("div", { key: "bd", className: "card" },
          e("ul", { className: "breakdown" },
            C.stages.map(function(st) {
              if (!st.lines.length) return e("li", { key: st.key, className: "stage-row" }, e("span", null, st.name), e("span", { className: "tag", style: { textTransform: "none", letterSpacing: 0 } }, "no costs listed"));
              return [e("li", { key: st.key, className: "stage-row" }, e("span", null, st.name))].concat(
                st.lines.map(function(l, i) {
                  var pName = "";
                  PS.forEach(function(p) { if (p.key === l.p) pName = p.name; });
                  return e("li", { key: st.key + i },
                    e("span", null, pName + (l.what ? ": " + l.what : ""), " ", e("span", { className: "tag" }, l.basis === "shared" ? "(whole year)" : "(each unit)")),
                    e("span", { className: "amt" }, moneyRange(l.low, l.high))
                  );
                })
              );
            })
          ),
          e("div", { className: "fine" }, "Running costs only. The cost of building it comes later.")
        ),

        e("div", { key: "sl3", className: "section-label" }, "Now say it in your own words"),
        e("div", { key: "own", className: "card" },
          e("div", { className: "own-prefix" }, "This pays for itself if …"),
          text("ownSentence", "finish the sentence", { rows: 2 })
        ),

        e("div", { key: "act", className: "actions no-print" },
          e("button", { className: "btn", onClick: copyText }, copied ? "Copied" : "Copy for my journal"),
          e("button", { className: "btn btn-ghost", onClick: function() { window.print(); } }, "Print / Save PDF"),
          e("button", { className: "btn btn-ghost", onClick: function() { go("number"); } }, "← Change my answers"),
          e("button", { className: "btn btn-ghost", onClick: startFresh }, "Start fresh")
        ),
        e("p", { key: "pn", className: "paste-note no-print" },
          "Paste the copied text into your journal. Keep the first line as it is: the Venture Assessment looks for it, and will use these answers so you don't type them again.")
      );
    }

    var root = ReactDOM.createRoot(document.getElementById("app"));
    root.render(e(App));
  </script>
</body>
</html>
